<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StellaeAI Star Office</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    overflow: hidden;
    font-family: 'Press Start 2P', monospace;
    image-rendering: -moz-crisp-edges;
    image-rendering: -webkit-crisp-edges;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: default;
  }

  canvas {
    display: block;
    margin: 0 auto;
    image-rendering: -moz-crisp-edges;
    image-rendering: -webkit-crisp-edges;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  #ui-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  #dialog-box {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 600px;
    background: #1a1a2eee;
    border: 3px solid #e8d4a2;
    border-radius: 10px;
    padding: 16px 20px;
    color: #e8d4a2;
    font-size: 13px;
    line-height: 1.8;
    display: none;
    pointer-events: auto;
    z-index: 20;
    box-shadow: 0 0 20px rgba(232,212,162,0.3), inset 0 0 30px rgba(0,0,0,0.5);
  }

  #dialog-box .speaker {
    color: #ff9ecd;
    font-size: 11px;
    margin-bottom: 8px;
    text-shadow: 0 0 8px rgba(255,158,205,0.5);
  }

  #dialog-box .text {
    min-height: 40px;
  }

  #dialog-box .hint {
    text-align: right;
    font-size: 9px;
    color: #8888aa;
    margin-top: 8px;
    animation: blink 1s infinite;
  }
  #dialog-box .auto-bar {
    height: 2px;
    background: #e8d4a2;
    border-radius: 1px;
    margin-top: 6px;
    transform-origin: left;
    animation: autoShrink 4s linear forwards;
  }
  @keyframes autoShrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  #room-tabs {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    pointer-events: auto;
    z-index: 20;
  }

  .room-tab {
    background: #2a2a4a;
    border: 3px solid #5a5a8a;
    color: #aaaacc;
    padding: 8px 18px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 4px;
  }

  .room-tab:hover {
    background: #3a3a6a;
    border-color: #e8d4a2;
    color: #e8d4a2;
  }

  .room-tab.active {
    background: #4a3a6a;
    border-color: #ff9ecd;
    color: #ff9ecd;
    box-shadow: 0 0 12px rgba(255,158,205,0.3);
  }

  #time-display {
    position: fixed;
    top: 16px;
    right: 24px;
    color: #e8d4a2;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    pointer-events: none;
    z-index: 20;
    text-shadow: 0 0 8px rgba(232,212,162,0.4);
  }

  #status-bar {
    position: fixed;
    top: 16px;
    left: 24px;
    color: #8888aa;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    pointer-events: none;
    z-index: 20;
  }

  #tooltip {
    position: fixed;
    background: #1a1a2eee;
    border: 2px solid #e8d4a2;
    color: #e8d4a2;
    padding: 6px 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    border-radius: 4px;
    display: none;
    pointer-events: none;
    z-index: 30;
    white-space: nowrap;
  }

  #text-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 6;
  }

  #particles-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
  }

  /* === NEW LAYOUT === */
  body { display: flex; flex-direction: column; height: 100vh; }

  #app-container {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  #canvas-area {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    background: #1a1a2e;
  }

  #side-panel {
    width: 380px;
    min-width: 380px;
    display: flex;
    flex-direction: column;
    background: #0e0e22;
    border-left: 2px solid #2a2a4a;
    z-index: 25;
    font-family: -apple-system, 'Segoe UI', sans-serif;
  }

  #panel-header {
    display: flex;
    align-items: center;
    border-bottom: 2px solid #2a2a4a;
    background: #12122a;
    padding-right: 8px;
  }

  .panel-tab {
    flex: 1;
    padding: 12px 8px;
    text-align: center;
    font-size: 12px;
    color: #666;
    cursor: pointer;
    border: none;
    background: transparent;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    transition: all 0.2s;
  }

  .panel-tab:hover { color: #aaa; }
  .panel-tab.active {
    color: #e8d4a2;
    border-bottom: 2px solid #e8d4a2;
    background: #1a1a30;
  }

  #chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    scroll-behavior: smooth;
  }

  #chat-log::-webkit-scrollbar { width: 4px; }
  #chat-log::-webkit-scrollbar-thumb { background: #3a3a5a; border-radius: 2px; }

  .chat-entry {
    margin-bottom: 16px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .chat-time {
    font-size: 10px;
    color: #555;
    margin-bottom: 4px;
    font-family: 'Press Start 2P', monospace;
  }

  .chat-speaker {
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .chat-text {
    color: #ccc;
    font-size: 13px;
    line-height: 1.7;
    padding-left: 10px;
    border-left: 3px solid;
  }

  .chat-divider {
    border: none;
    border-top: 1px dashed #2a2a4a;
    margin: 20px 0;
  }

  .chat-event-label {
    text-align: center;
    font-size: 10px;
    color: #ff9ecd;
    padding: 6px 12px;
    background: #1a0a1a;
    border-radius: 12px;
    display: inline-block;
    margin: 8px auto;
    font-family: 'Press Start 2P', monospace;
  }

  .chat-event-wrap { text-align: center; margin: 12px 0; }

  #artifacts-panel {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: none;
  }

  #artifacts-panel::-webkit-scrollbar { width: 4px; }
  #artifacts-panel::-webkit-scrollbar-thumb { background: #3a3a5a; border-radius: 2px; }

  .artifact-card {
    background: #141430;
    border: 2px solid #2a2a4a;
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 14px;
    animation: fadeIn 0.3s ease;
  }

  .artifact-card:hover { border-color: #4a4a6a; }

  .artifact-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .artifact-type {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
  }

  .artifact-type.doc { background: #2a1a3a; color: #c77dff; }
  .artifact-type.code { background: #1a2a1a; color: #3af5c8; }
  .artifact-type.design { background: #3a2a1a; color: #ffaa55; }
  .artifact-type.copy { background: #1a1a3a; color: #4a9fff; }

  .artifact-title {
    color: #e8d4a2;
    font-size: 13px;
    font-weight: 700;
  }

  .artifact-author {
    font-size: 10px;
    color: #888;
    margin-bottom: 10px;
  }

  .artifact-content {
    color: #aaa;
    font-size: 12px;
    line-height: 1.8;
    white-space: pre-wrap;
    background: #0a0a1a;
    padding: 12px;
    border-radius: 6px;
    border: 1px solid #1a1a3a;
    max-height: 300px;
    overflow-y: auto;
    font-family: 'SF Mono', 'Consolas', monospace;
  }

  #bottom-bar {
    height: 56px;
    background: #0a0a1e;
    border-top: 2px solid #2a2a4a;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
    z-index: 25;
    font-family: 'Press Start 2P', monospace;
  }

  .ctrl-btn {
    background: #1a1a3a;
    border: 2px solid #3a3a5a;
    color: #e8d4a2;
    padding: 8px 14px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
  }

  .ctrl-btn:hover { border-color: #e8d4a2; background: #2a2a4a; }
  .ctrl-btn.active { border-color: #ff9ecd; color: #ff9ecd; }

  #day-dots {
    display: flex;
    gap: 4px;
    align-items: center;
    flex-wrap: wrap;
    max-width: 200px;
  }

  .day-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid #555;
    background: transparent;
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.15s, background 0.2s;
  }
  .day-dot:hover { transform: scale(1.3); background: #ff9ecd66; }

  .day-dot.current { background: #ff9ecd; border-color: #ff9ecd; box-shadow: 0 0 8px #ff9ecd88; }
  .day-dot.done { background: #4aaf5a; border-color: #4aaf5a; }
  .day-dot::after {
    content: attr(data-label);
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 7px;
    color: #888;
    white-space: nowrap;
    display: none;
  }
  .day-dot:hover::after { display: block; }

  #progress-wrap {
    flex: 1;
    max-width: 180px;
    height: 6px;
    background: #1a1a3a;
    border-radius: 3px;
    overflow: hidden;
  }

  #progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff9ecd, #c77dff);
    border-radius: 3px;
    width: 0%;
    transition: width 0.5s ease;
  }

  #day-info {
    color: #e8d4a2;
    font-size: 9px;
    margin-left: auto;
    text-align: right;
    line-height: 1.4;
  }

  #day-info span { color: #ff9ecd; }

  /* Side panel toggle button (floating, shown when panel collapsed) */
  #panel-toggle {
    position: absolute;
    right: 8px; top: 8px;
    width: 40px; height: 40px;
    background: #12122aee;
    border: 2px solid #3a3a5a;
    border-radius: 10px;
    color: #e8d4a2;
    font-size: 16px;
    cursor: pointer;
    z-index: 30;
    display: none;
    align-items: center;
    justify-content: center;
    transition: all .2s;
  }
  #panel-toggle:hover { background: #2a2a4a; border-color: #e8d4a2; }
  #panel-toggle.visible { display: flex; }

  /* Close button inside panel header */
  .panel-close {
    width: 28px; height: 28px;
    background: transparent;
    border: 1px solid #2a2a4a;
    border-radius: 6px;
    color: #888;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-left: 4px;
    transition: all .2s;
  }
  .panel-close:hover { color: #e8d4a2; border-color: #e8d4a2; }

  /* Collapsed side panel */
  #side-panel.collapsed {
    width: 0 !important;
    min-width: 0 !important;
    overflow: hidden;
    border-left: none;
  }

  /* Responsive adjustments */
  @media (max-width: 900px) {
    #side-panel {
      width: 0 !important;
      min-width: 0 !important;
      overflow: hidden;
      border-left: none;
    }
    #side-panel.expanded {
      position: absolute;
      right: 0; top: 0; bottom: 56px;
      width: min(86vw, 340px) !important;
      min-width: 0 !important;
      overflow: visible;
      border-left: 2px solid #2a2a4a;
      z-index: 35;
      box-shadow: -8px 0 24px rgba(0,0,0,.5);
    }
    #panel-toggle { display: flex !important; }
  }
  @media (max-width: 640px) {
    /* Top bars 挤缩 + 更小字号，避免和底部栏撞车 */
    #room-tabs { top: 10px; gap: 4px; padding: 4px; }
    .room-tab { padding: 5px 10px; font-size: 8px; border-width: 2px; }
    #time-display { top: 10px; right: 10px; font-size: 8px; }
    #status-bar { top: 10px; left: 10px; font-size: 7px; }

    /* 对话框更贴屏幕 */
    #dialog-box {
      left: 8px !important; right: 8px !important;
      bottom: 66px !important;
      padding: 12px 14px !important;
      max-width: none !important;
    }
    #dialog-box .speaker { font-size: 10px !important; }
    #dialog-box .text { font-size: 12px !important; line-height: 1.55 !important; }
    #dialog-box .hint { font-size: 8px !important; }

    /* 底栏：把日期圆点横向滚动，按钮缩小 */
    #bottom-bar {
      height: 56px; padding: 0 8px; gap: 6px;
      overflow-x: auto; overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    #bottom-bar::-webkit-scrollbar { display: none; }
    .ctrl-btn { font-size: 8px; padding: 6px 8px; flex-shrink: 0; }
    #day-dots {
      max-width: none; flex-wrap: nowrap; overflow-x: auto;
      padding: 2px 4px; scrollbar-width: none;
    }
    #day-dots::-webkit-scrollbar { display: none; }
    .day-dot { width: 9px; height: 9px; }
    #progress-wrap { max-width: 80px; flex-shrink: 0; }
    #day-info {
      font-size: 8px; margin-left: 6px; flex-shrink: 0;
      white-space: nowrap;
    }

    /* 侧边面板打开时铺满更大面积 */
    #side-panel.expanded {
      width: min(92vw, 360px) !important;
    }
    .panel-tab { font-size: 11px; padding: 10px 6px; }
    #chat-log { padding: 12px; }
    .chat-text { font-size: 12px; }

    /* 悬浮按钮稍小 */
    #panel-toggle { width: 36px; height: 36px; font-size: 14px; right: 6px; top: 6px; }
  }
  @media (max-width: 420px) {
    #room-tabs { gap: 3px; }
    .room-tab { padding: 4px 8px; font-size: 7px; }
    .ctrl-btn { font-size: 7px; padding: 5px 6px; }
    #progress-wrap { max-width: 60px; }
    #day-info { font-size: 7px; }
  }
</style>
</head>
<body>

<div id="app-container">
  <div id="canvas-area">
    <canvas id="game-canvas"></canvas>
    <canvas id="text-canvas"></canvas>
    <canvas id="particles-canvas"></canvas>
    <div id="panel-toggle" onclick="toggleSidePanel()">💬</div>

    <div id="ui-overlay">
      <div id="room-tabs">
    <button class="room-tab active" data-room="office">办公室</button>
    <button class="room-tab" data-room="lounge">休息间</button>
    <button class="room-tab" data-room="rooftop">楼顶露台</button>
      </div>
      <div id="time-display"></div>
      <div id="status-bar"></div>
    </div>

    <div id="dialog-box">
      <div class="speaker"></div>
      <div class="text"></div>
      <div class="hint">点击跳过</div>
      <div class="auto-bar" id="dialogAutoBar"></div>
    </div>
  </div>

  <div id="side-panel">
    <div id="panel-header">
      <button class="panel-tab active" data-panel="chat">💬 对话日志</button>
      <button class="panel-tab" data-panel="artifacts">📄 产出物</button>
      <button class="panel-close" onclick="toggleSidePanel()" title="关闭面板">✕</button>
    </div>
    <div id="chat-log">
      <div class="chat-event-wrap"><span class="chat-event-label">等待开始...</span></div>
    </div>
    <div id="artifacts-panel">
      <div style="color:#555;font-size:12px;text-align:center;padding:40px 20px;">产出物将在角色工作后出现在这里</div>
    </div>
  </div>
</div>

<div id="bottom-bar">
  <button class="ctrl-btn" id="play-btn">▶ PLAY</button>
  <button class="ctrl-btn" id="speed-btn">1x</button>
  <div id="day-dots"></div>
  <div id="progress-wrap"><div id="progress-fill"></div></div>
  <div id="day-info">DAY 1 · <span>S1 起源</span></div>
</div>

<div id="tooltip"></div>

<script>
// ============================================================
// STELLAE AI - STAR OFFICE - Stardew Valley Style Pixel Scene
// ============================================================

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const pCanvas = document.getElementById('particles-canvas');
const pCtx = pCanvas.getContext('2d');

// Text canvas — full screen resolution so text is never blurry
const tCanvas = document.getElementById('text-canvas');
const tCtx = tCanvas.getContext('2d');

function resizeTextCanvas() {
  tCanvas.width  = window.innerWidth;
  tCanvas.height = window.innerHeight;
}
resizeTextCanvas();
window.addEventListener('resize', resizeTextCanvas);

// Convert a point from game-canvas pixel coords → screen coords
function toScreen(cx, cy) {
  const r = canvas.getBoundingClientRect();
  return { x: r.left + cx * SCALE, y: r.top + cy * SCALE };
}

// Draw crisp text on the text-canvas at game-canvas coordinates
// fontSize is in SCREEN pixels (e.g. 13 = small label, 18 = sign text)
function drawText(cx, cy, text, fontSize, color, align = 'left') {
  const p = toScreen(cx, cy);
  tCtx.save();
  tCtx.font = `${fontSize}px "Press Start 2P", monospace`;
  tCtx.fillStyle = color;
  tCtx.textAlign = align;
  tCtx.textBaseline = 'middle';
  tCtx.fillText(text, p.x, p.y);
  tCtx.restore();
}

// Draw crisp text with a background pill on the text-canvas
function drawTextBubble(cx, cy, text, fontSize, textColor, bgColor, borderColor) {
  const p     = toScreen(cx, cy);
  tCtx.save();
  tCtx.font   = `${fontSize}px "Press Start 2P", monospace`;
  const tw    = tCtx.measureText(text).width;
  const ph    = fontSize + 8;  // pill height
  const pw    = tw + 14;
  const px0   = p.x;
  const py0   = p.y - ph / 2;
  // Background
  tCtx.fillStyle = bgColor;
  tCtx.beginPath();
  tCtx.roundRect(px0, py0, pw, ph, 4);
  tCtx.fill();
  // Border
  if (borderColor) {
    tCtx.strokeStyle = borderColor;
    tCtx.lineWidth   = 1.5;
    tCtx.stroke();
  }
  // Tail (little triangle pointing down-left)
  tCtx.fillStyle = bgColor;
  tCtx.beginPath();
  tCtx.moveTo(px0 + 6, py0 + ph);
  tCtx.lineTo(px0 + 14, py0 + ph);
  tCtx.lineTo(px0 + 6,  py0 + ph + 5);
  tCtx.closePath();
  tCtx.fill();
  if (borderColor) {
    tCtx.strokeStyle = borderColor;
    tCtx.lineWidth   = 1;
    tCtx.beginPath();
    tCtx.moveTo(px0 + 6, py0 + ph);
    tCtx.lineTo(px0 + 6, py0 + ph + 5);
    tCtx.lineTo(px0 + 14, py0 + ph);
    tCtx.stroke();
  }
  // Text
  tCtx.fillStyle    = textColor;
  tCtx.textAlign    = 'left';
  tCtx.textBaseline = 'middle';
  tCtx.fillText(text, px0 + 7, py0 + ph / 2);
  tCtx.restore();
}

// --- CONSTANTS ---
const TILE = 16;
const SCALE = 2;
const COLS = 30;
const ROWS = 18;
const W = COLS * TILE;
const H = ROWS * TILE;

canvas.width = W;
canvas.height = H;
canvas.style.width = (W * SCALE) + 'px';
canvas.style.height = (H * SCALE) + 'px';

function resizeParticles() {
  pCanvas.width = window.innerWidth;
  pCanvas.height = window.innerHeight;
}
resizeParticles();
window.addEventListener('resize', resizeParticles);

// --- COLOR PALETTE (Stardew-inspired warm tones) ---
const PAL = {
  bg: '#2d2137',
  floor: '#4a3c5c',
  floorLight: '#5a4c6c',
  wall: '#3d3050',
  wallTop: '#2d2040',
  wood: '#8b6f47',
  woodDark: '#6b4f27',
  woodLight: '#ab8f67',
  desk: '#7a6a4a',
  deskTop: '#9a8a6a',
  screen: '#3af5c8',
  screenGlow: '#1ad5a8',
  screenBlue: '#4a9fff',
  screenPurple: '#c77dff',
  chair: '#5a4a6a',
  plant: '#4aaf5a',
  plantDark: '#2a8f3a',
  plantPot: '#c47a3a',
  star: '#ffe66d',
  pink: '#ff9ecd',
  pinkDark: '#d06eaa',
  skinLight: '#fde8d0',
  skin: '#f5d0b0',
  hairBrown: '#6b3a2a',
  hairPink: '#e85a8a',
  shirtWhite: '#eee8dd',
  shirtDark: '#3a3a5a',
  sofaBlue: '#4a6a9a',
  sofaLight: '#6a8aba',
  carpet: '#6a3a4a',
  carpetLight: '#8a5a6a',
  lamp: '#ffe8aa',
  lampGlow: '#fff4dd',
  bookRed: '#c44a3a',

const WALK_SPEED = 0.3; // tiles per frame (slower, more natural)

function initCharacterStates() {
  for (const [key, char] of Object.entries(characters)) {
    const room = char.rooms[currentRoom];
    char.state = {
      rx: room.x,       // real X position (float, in tiles)
      ry: room.y,       // real Y position (float, in tiles)
      tx: room.x,       // target X
      ty: room.y,       // target Y
      facing: 'down',
      activity: room.activity,
      walking: false,
      idleTimer: 200 + Math.floor(Math.random() * 300), // slower movement frequency
      wpIndex: 0,       // waypoint index
      walkFrame: 0,     // leg animation frame (0 or 1)
      walkTick: 0,      // frame counter for leg swap
    };
  }
}

function updateCharacters() {
  for (const [key, char] of Object.entries(characters)) {
    if (!char.state) continue;
    const s = char.state;

    // If dialog is open for this char, freeze them
    if (dialogActive && currentDialog && currentDialog.charKey === key) continue;

    if (s.walking) {
      // Move toward target
      const dx = s.tx - s.rx;
      const dy = s.ty - s.ry;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // Update facing direction
      if (Math.abs(dx) > Math.abs(dy)) {
        s.facing = dx > 0 ? 'right' : 'left';
      } else if (dy !== 0) {
        s.facing = dy > 0 ? 'down' : 'up';
      }

      if (dist < WALK_SPEED) {
        // Arrived
        s.rx = s.tx;
        s.ry = s.ty;
        s.walking = false;
        s.walkFrame = 0;

        // Pick idle time from waypoint
        const wps = WAYPOINTS[key]?.[currentRoom];
        if (wps) {
          const wp = wps[s.wpIndex % wps.length];
          s.activity = wp[2];
          s.idleTimer = wp[3] + Math.floor(Math.random() * 60);
          if (wp[4]) s.facing = wp[4];
        }
      } else {
        s.rx += (dx / dist) * WALK_SPEED;
        s.ry += (dy / dist) * WALK_SPEED;
        // Leg animation: swap every 8 frames
        s.walkTick++;
        if (s.walkTick >= 8) { s.walkTick = 0; s.walkFrame = 1 - s.walkFrame; }
      }
    } else {
      // Idle: count down timer then pick next waypoint
      s.idleTimer--;
      if (s.idleTimer <= 0) {
        const wps = WAYPOINTS[key]?.[currentRoom];
        if (wps) {
          s.wpIndex = (s.wpIndex + 1) % wps.length;
          const wp = wps[s.wpIndex];
          s.tx = wp[0];
          s.ty = wp[1];
          s.walking = true;
          s.walkTick = 0;
        }
      }
    }
  }
}

function resetCharacterStates() {
  for (const [key, char] of Object.entries(characters)) {
    const room = char.rooms[currentRoom];
    if (!room) continue;
    char.state = {
      rx: room.x, ry: room.y,
      tx: room.x, ty: room.y,
      facing: 'down',
      activity: room.activity,
      walking: false,
      idleTimer: 200 + Math.floor(Math.random() * 300),
      wpIndex: 0,
      walkFrame: 0,
      walkTick: 0,
    };
  }
}

// --- PIXEL ART DRAWING HELPERS ---
function px(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), w || 1, h || 1);
}

function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
}

function rectOutline(x, y, w, h, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.strokeRect(Math.floor(x) + 0.5, Math.floor(y) + 0.5, w - 1, h - 1);
}

function drawRooftop() {
  // Sky background
  rect(0, 0, W, H, PAL.skyNight);

  // Stars
  const starSeed = [
    [2,1],[5,0],[8,2],[12,1],[15,0],[19,2],[22,1],[26,0],[28,2],
    [3,3],[7,1],[10,0],[14,3],[18,1],[21,3],[25,2],[29,1],
    [1,2],[6,3],[9,1],[13,0],[17,2],[20,0],[24,1],[27,3],
  ];
  starSeed.forEach(([sx, sy]) => {
    const twinkle = Math.sin(gameTime * 0.03 + sx * 7 + sy * 13) * 0.5 + 0.5;
    ctx.globalAlpha = 0.3 + twinkle * 0.7;
    px(sx * TILE + 8, sy * TILE + 4, 2, 2, PAL.skyStars);
    if (twinkle > 0.7) {
      ctx.globalAlpha = twinkle * 0.3;
      px(sx * TILE + 7, sy * TILE + 5, 1, 1, PAL.skyStars);
      px(sx * TILE + 11, sy * TILE + 5, 1, 1, PAL.skyStars);
      px(sx * TILE + 9, sy * TILE + 3, 1, 1, PAL.skyStars);
      px(sx * TILE + 9, sy * TILE + 7, 1, 1, PAL.skyStars);
    }
  });
  ctx.globalAlpha = 1;

  // Moon
  drawMoon(24 * TILE, 1 * TILE);

  // Floor (rooftop)
  rect(0, 8 * TILE, W, H - 8 * TILE, '#3a3040');
  for (let r = 8; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if ((r + c) % 3 === 0) {
        px(c * TILE + 4, r * TILE + 4, 2, 2, '#4a4050');
      }
    }
  }

  // AC Units on roof
  drawACUnit(2 * TILE, 14 * TILE);
  drawACUnit(25 * TILE, 15 * TILE);

  // Railing
  for (let c = 0; c < COLS; c++) {
    rect(c * TILE, 8 * TILE, TILE, 2, PAL.woodDark);
    if (c % 2 === 0) {
      rect(c * TILE + 7, 7 * TILE, 2, TILE + 2, PAL.wood);
      rect(c * TILE + 6, 7 * TILE, 4, 2, PAL.woodLight);
    }
  }

  // Fairy lights string across the sky
  ctx.strokeStyle = '#222';
  ctx.beginPath();
  ctx.moveTo(0, 4 * TILE);
  ctx.quadraticCurveTo(15 * TILE, 6 * TILE, W, 3 * TILE);
  ctx.stroke();

  for (let i = 0; i < 20; i++) {
    const lx = 1.5 * TILE + i * 1.5 * TILE;
    // Approximating curve y
    const t = i / 20;
    const ly = (1-t)*(1-t)*4*TILE + 2*(1-t)*t*6*TILE + t*t*3*TILE;
    
    const colors = [PAL.pink, PAL.star, PAL.neonBlue, PAL.screen];
    const flicker = Math.sin(gameTime * 0.05 + i * 2.5) * 0.3 + 0.7;
    ctx.globalAlpha = flicker;
    px(lx, ly, 3, 3, colors[i % colors.length]);
    ctx.globalAlpha = flicker * 0.3;
    rect(lx - 1, ly - 1, 5, 5, colors[i % colors.length]);
    ctx.globalAlpha = 1;
  }

  // Telescope
  drawTelescope(6 * TILE, 9 * TILE);

  // Garden area
  drawRooftopGarden(18 * TILE, 9 * TILE);
  drawRooftopGarden(1 * TILE, 10 * TILE); // extra planter

  // Bench
  drawBench(12 * TILE, 14 * TILE);
  drawBench(14 * TILE, 11 * TILE); // extra bench

  // Lanterns
  drawLantern(4 * TILE, 12 * TILE);
  drawLantern(25 * TILE, 11 * TILE);
  drawLantern(11 * TILE, 9 * TILE); // extra lantern

  // Small table
  drawSmallTable(8 * TILE, 13 * TILE);
}

function drawPoster(x, y, w, h, colors) {
  rect(x - 1, y - 1, w + 2, h + 2, PAL.woodDark);
  rect(x, y, w, h, PAL.white);
  // Pattern inside
  rect(x + 2, y + 2, w - 4, h / 2, colors[0] || PAL.screenBlue);
  rect(x + 2, y + h / 2 + 4, w - 4, 2, colors[1] || PAL.bookRed);
}

function drawWaterCooler(x, y) {
  // Base
  rect(x, y + 10, TILE, TILE, '#ddd');
  rect(x + 2, y + 12, TILE - 4, TILE - 4, '#bbb');
  // Spout
  px(x + 6, y + 16, 2, 2, PAL.bookRed);
  px(x + 10, y + 16, 2, 2, PAL.screenBlue);
  // Bottle
  rect(x + 2, y, TILE - 4, 10, '#aaddff88');
  rect(x + 4, y - 2, TILE - 8, 2, '#aaddff88');
  // Water inside
  rect(x + 3, y + 3, TILE - 6, 7, '#88ccffcc');
  // Bubbles
  if (gameTime % 60 < 20) px(x + 6, y + 6 - (gameTime % 20) / 4, 1, 1, PAL.white);
}

function drawTrashCan(x, y) {
  rect(x, y + 4, 10, 12, '#666');
  rect(x - 1, y + 2, 12, 2, '#555');
  // lines
  px(x + 2, y + 6, 1, 8, '#555');
  px(x + 5, y + 6, 1, 8, '#555');
  px(x + 8, y + 6, 1, 8, '#555');
}

function drawTV(x, y, w, h) {
  rect(x - 2, y - 2, w + 4, h + 4, '#111');
  // Screen
  const flicker = Math.sin(gameTime * 0.05);
  rect(x, y, w, h, flicker > 0 ? '#1a2a3a' : '#112233');
  if (flicker > 0.5) {
    rect(x + 4, y + 4, w - 8, h - 8, PAL.screenPurple);
    rect(x + 8, y + 6, w - 16, 4, PAL.white);
  }
}

function drawBeanBag(x, y, color) {

function drawWindow(x, y, w, h) {

function drawWallSign(x, y, text) {

function drawDesk(x, y, hasMonitor) {
  // Desk body
  rect(x, y + 8, TILE * 3, 6, PAL.deskTop);

  rect(x + 2, y + 18, 3, 6, PAL.woodDark);
  rect(x + TILE * 3 - 5, y + 18, 3, 6, PAL.woodDark);

  if (hasMonitor) {
    // Monitor
    rect(x + TILE + 2, y, TILE - 4, 8, PAL.grayDark);
    const screenColor = Math.sin(gameTime * 0.04) > 0 ? PAL.screen : PAL.screenBlue;
    rect(x + TILE + 3, y + 1, TILE - 6, 6, screenColor);
    // Screen glow
    ctx.globalAlpha = 0.15;
    rect(x + TILE, y - 2, TILE, 12, screenColor);

    rect(x + TILE + 5, y + 8, 4, 2, PAL.grayDark);

    px(x + TILE * 2 + 8, y + 3, 2, 3, PAL.pink);

  rect(x + 2, y + 6, 5, 5, PAL.coffeeCup);
  rect(x + 3, y + 7, 3, 2, PAL.coffee);
  px(x + 7, y + 8, 2, 3, PAL.coffeeCup);

  const steam = Math.sin(gameTime * 0.06);
  ctx.globalAlpha = 0.4;
  px(x + 3, y + 4 + steam, 1, 2, PAL.white);

function drawWhiteboard(x, y, w, h) {
  rect(x - 2, y - 2, w + 4, h + 4, PAL.woodDark);
  rect(x, y, w, h, '#eeeedd');
  // Code-like lines
  const codeColors = ['#c04040', '#3070b0', '#408040', '#805090', '#b07020'];
  const lineLens = [0.7, 0.45, 0.6, 0.3, 0.8, 0.5, 0.35, 0.55];
  for (let i = 0; i < lineLens.length && (i * 5 + 4) < h - 6; i++) {
    const indent = (i === 1 || i === 2 || i === 4 || i === 5) ? 8 : 0;
    rect(x + 4 + indent, y + 4 + i * 5, w * lineLens[i] * 0.6, 2, codeColors[i % codeColors.length]);
  }
  // "Code" label at top-right
  drawText(x + w - 4, y + 2, '</>', 5, '#999', 'right');
  // Marker tray at bottom
  rect(x + 6, y + h - 2, w - 12, 3, PAL.wood);
  rect(x + 10, y + h - 4, 6, 4, '#e04040');
  rect(x + 20, y + h - 4, 6, 4, '#3070b0');
  rect(x + 30, y + h - 4, 6, 4, '#408040');
}

    rect(x, y, sw, sh, PAL.sofaBlue);
    rect(x + 2, y + 2, sw - 4, sh - 6, PAL.sofaLight);

    rect(x, y + sh - 6, sw, 6, PAL.sofaBlue);
    // Cushions
    rect(x + 6, y + 4, (sw - 16) / 2 - 1, sh - 12, '#5a7aaa');
    rect(x + 6 + (sw - 16) / 2 + 2, y + 4, (sw - 16) / 2 - 1, sh - 12, '#5a7aaa');

    rect(x, y, sw, sh, PAL.sofaBlue);
    rect(x + 2, y + 2, sw - 4, sh - 6, PAL.sofaLight);

    if (facing === 'right') {
      rect(x, y - 4, 6, sh + 4, PAL.sofaBlue);

      rect(x + sw - 6, y - 4, 6, sh + 4, PAL.sofaBlue);

    rect(x + 8 + (sw - 16) / 2 + 1, y + 4, (sw - 16) / 2 - 1, sh - 10, '#5a7aaa');

  }
}

function drawTVAnimated(x, y, w, h) {
  // Frame
  rect(x - 3, y - 3, w + 6, h + 6, '#222');
  rect(x - 2, y - 2, w + 4, h + 4, '#111');
  // Screen background
  rect(x, y, w, h, '#1a2a1a');
  // Pixel animal animation (cat/dog that moves)
  const frame = Math.floor(gameTime * 0.03) % 120;
  const animalX = x + (frame % 60 < 30 ? frame % 30 : 30 - frame % 30) * (w / 34);
  const animalY = y + h - 18 + Math.sin(frame * 0.3) * 3;
  // Ground
  rect(x, y + h - 6, w, 6, '#2a4a2a');
  // Grass tufts
  for (let i = 0; i < w; i += 8) {
    rect(x + i, y + h - 8, 2, 4, '#3a6a3a');
  }
  // Little pixel cat
  rect(animalX, animalY, 10, 8, '#ffaa44');
  rect(animalX + 1, animalY - 4, 8, 5, '#ffaa44');
  rect(animalX + 2, animalY - 3, 2, 2, '#111');
  rect(animalX + 6, animalY - 3, 2, 2, '#111');
  rect(animalX - 1, animalY - 6, 3, 3, '#ffaa44');
  rect(animalX + 8, animalY - 6, 3, 3, '#ffaa44');
  // Tail
  const tailWag = Math.sin(gameTime * 0.1) * 3;
  rect(animalX + 10, animalY + tailWag, 2, 6, '#ffaa44');
  // Legs (walking)
  const legFrame = Math.floor(gameTime * 0.06) % 2;
  rect(animalX + 1, animalY + 7, 2, 3 + legFrame, '#ffaa44');
  rect(animalX + 7, animalY + 7, 2, 3 + (1 - legFrame), '#ffaa44');
  // Little pixel bird
  const birdX = x + w - 20 - Math.sin(frame * 0.1) * 10;
  const birdY = y + 10 + Math.sin(frame * 0.15) * 6;
  rect(birdX, birdY, 6, 4, '#66aaff');
  rect(birdX + 6, birdY + 1, 3, 2, '#ffcc00');
  // Wings flap
  const wingY = Math.sin(gameTime * 0.12) > 0 ? -2 : 0;
  rect(birdX + 1, birdY + wingY - 1, 4, 2, '#5588dd');
  // Sun
  rect(x + w - 14, y + 4, 8, 8, '#ffee44');
  // Cloud
  rect(x + 10, y + 6, 16, 6, '#aaddaa');
  rect(x + 13, y + 3, 10, 4, '#aaddaa');
}

function drawLoungeCat(startX, startY, rangeW) {
  const cycle = gameTime * 0.02;
  const progress = (Math.sin(cycle) + 1) / 2;
  const catX = startX + progress * rangeW;
  const catY = startY;
  const goingRight = Math.cos(cycle) > 0;
  const walkFrame = Math.floor(gameTime * 0.08) % 4;
  const legOff = walkFrame < 2 ? 1 : 0;

  // Shadow
  ctx.globalAlpha = 0.2;
  rect(catX - 1, catY + 9, 14, 3, '#000');
  ctx.globalAlpha = 1;

  if (goingRight) {
    // Body
    rect(catX, catY, 12, 7, '#f0a030');
    rect(catX + 1, catY + 1, 10, 5, '#f8b848');
    // Head
    rect(catX + 10, catY - 3, 7, 7, '#f0a030');
    rect(catX + 11, catY - 2, 5, 5, '#f8b848');
    // Ears
    rect(catX + 11, catY - 5, 2, 3, '#f0a030');
    rect(catX + 15, catY - 5, 2, 3, '#f0a030');
    // Eyes
    rect(catX + 13, catY - 1, 1, 2, '#222');
    rect(catX + 15, catY - 1, 1, 2, '#222');
    // Nose
    rect(catX + 16, catY + 1, 1, 1, '#e07070');
    // Tail (wagging)
    const tailY = Math.sin(gameTime * 0.1) * 2;
    rect(catX - 4, catY - 2 + tailY, 5, 2, '#f0a030');
    rect(catX - 6, catY - 4 + tailY, 3, 3, '#e89020');
    // Legs
    rect(catX + 1, catY + 6, 2, 3 + legOff, '#e89020');
    rect(catX + 5, catY + 6, 2, 3 + (1 - legOff), '#e89020');
    rect(catX + 8, catY + 6, 2, 3 + legOff, '#e89020');
    rect(catX + 11, catY + 6, 2, 3 + (1 - legOff), '#e89020');
    // Stripes
    rect(catX + 3, catY + 1, 1, 4, '#e08818');
    rect(catX + 6, catY + 1, 1, 4, '#e08818');
  } else {
    // Body (flipped)
    rect(catX, catY, 12, 7, '#f0a030');
    rect(catX + 1, catY + 1, 10, 5, '#f8b848');
    // Head (left side)
    rect(catX - 5, catY - 3, 7, 7, '#f0a030');
    rect(catX - 4, catY - 2, 5, 5, '#f8b848');
    // Ears
    rect(catX - 5, catY - 5, 2, 3, '#f0a030');
    rect(catX - 1, catY - 5, 2, 3, '#f0a030');
    // Eyes
    rect(catX - 4, catY - 1, 1, 2, '#222');
    rect(catX - 2, catY - 1, 1, 2, '#222');
    // Nose
    rect(catX - 5, catY + 1, 1, 1, '#e07070');
    // Tail
    const tailY = Math.sin(gameTime * 0.1) * 2;
    rect(catX + 11, catY - 2 + tailY, 5, 2, '#f0a030');
    rect(catX + 15, catY - 4 + tailY, 3, 3, '#e89020');
    // Legs
    rect(catX + 1, catY + 6, 2, 3 + legOff, '#e89020');
    rect(catX + 5, catY + 6, 2, 3 + (1 - legOff), '#e89020');
    rect(catX + 8, catY + 6, 2, 3 + legOff, '#e89020');
    rect(catX + 11, catY + 6, 2, 3 + (1 - legOff), '#e89020');
    // Stripes
    rect(catX + 5, catY + 1, 1, 4, '#e08818');
    rect(catX + 8, catY + 1, 1, 4, '#e08818');
  }
}

function drawNeonSign(x, y, text) {
  const charW = /[\u4e00-\u9fff]/.test(text) ? 14 : 6;
  const tw = text.length * charW + 8;
  const glow = Math.sin(gameTime * 0.04) * 0.2 + 0.8;
  ctx.globalAlpha = glow * 0.25;
  rect(x - 4, y - 4, tw + 8, 16, PAL.neon);
  ctx.globalAlpha = 1;
  const p = toScreen(x + 4, y + 9);
  tCtx.save();
  tCtx.globalAlpha = glow;
  tCtx.font = '16px "Press Start 2P", monospace';
  tCtx.fillStyle = PAL.neon;
  tCtx.textBaseline = 'middle';
  tCtx.shadowColor = PAL.neon;

function drawMoon(x, y) {
  // Big moon
  for (let my = -12; my <= 12; my++) {
    for (let mx = -12; mx <= 12; mx++) {
      if (mx * mx + my * my <= 144) {
        const shade = Math.sqrt(mx * mx + my * my) / 12;
        ctx.globalAlpha = 1 - shade * 0.3;
        const isCrater = (mx === 3 && my === -2) || (mx === -5 && my === 4) || (mx === 1 && my === 6);
        px(x + mx + 12, y + my + 12, 1, 1, isCrater ? '#d0c8a0' : '#f0e8c0');
      }
    }
  }
  // Glow
  ctx.globalAlpha = 0.08;
  for (let r = 1; r <= 4; r++) {
    for (let my = -12 - r * 3; my <= 12 + r * 3; my++) {
      for (let mx = -12 - r * 3; mx <= 12 + r * 3; mx++) {
        if (mx * mx + my * my <= (12 + r * 3) * (12 + r * 3) && mx * mx + my * my > (12 + (r - 1) * 3) * (12 + (r - 1) * 3)) {
          px(x + mx + 12, y + my + 12, 1, 1, '#f0e8c0');
        }
      }
    }
  }
  ctx.globalAlpha = 1;
}

function drawRooftopGarden(x, y) {
  // Planter box
  rect(x, y + 12, TILE * 6, 8, PAL.woodDark);
  rect(x + 2, y + 8, TILE * 6 - 4, 6, '#3a2a1a');

    rect(x + 6 + i * 14 + sway, y + 8 - h, 4, h, PAL.plant);

    if (i % 3 === 0) {

    } else if (i % 3 === 1) {
      px(x + 7 + i * 14 + sway, y + 6 - h - 2, 2, 2, PAL.star);
    }
  }
}

// --- CHARACTER DRAWING ---

function drawCharacter(char, key) {
  const roomData = char.rooms[currentRoom];
  if (!roomData) return;
  const s = char.state;
  if (!s) return;

  const x = Math.round(s.rx * TILE);
  const y = Math.round(s.ry * TILE);
  // Only bob when idle (standing still)
  const bob = s.walking ? 0 : Math.sin(gameTime * 0.04 + char.bobOffset) * 1.5;
  const isHovered = hoveredEntity === key;

  // Sprite Dimensions (Adjusted for tighter crop & higher res)
  // Our base images are now cropped tightly around the characters.
  // We'll scale them up cleanly.
  const sw = 24;
  const sh = 54;
  const drawX = x + 8 - sw / 2;
  const drawY = y + 24 - sh + bob;

  // Shadow (made slightly wider to match new sprite size)
  ctx.globalAlpha = 0.3;
  rect(x + 1, y + 24, 14, 3, '#000');
  ctx.globalAlpha = 1;

  // Hover highlight
  if (isHovered) {
    ctx.globalAlpha = 0.12 + Math.sin(gameTime * 0.06) * 0.04;
    rect(drawX - 4, drawY - 4, sw + 8, sh + 8, char.color);
    ctx.globalAlpha = 1;
  }

  // --- NEW HIGH-RES SPRITE RENDERING ---
  let pose = 'front';
  if (s.facing === 'up') pose = 'back';
  if (s.facing === 'left' || s.facing === 'right') pose = 'side';
  
  const spriteKey = `${char.outfit}_${pose}`;
  const img = SPRITES[spriteKey];
  
  const walkBob = (s.walking && s.walkFrame === 1) ? -2 : 0;
  
  if (img && img.complete) {
    // If facing right, flip the 'side' image
    if (s.facing === 'right') {
      ctx.save();
      ctx.translate(drawX + sw / 2, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(img, -sw / 2, drawY + walkBob, sw, sh);
      ctx.restore();
    } else {
      ctx.drawImage(img, drawX, drawY + walkBob, sw, sh);
    }
  } else {
    // Fallback if images not loaded yet
    ctx.fillStyle = char.color;
    ctx.fillRect(drawX, drawY, sw, sh);
  }

  const by = y + bob;

  // Name tag (on hover) — drawn on crisp text-canvas
  if (isHovered) {
    const p = toScreen(x + 9, by - 48);
    tCtx.save();
    tCtx.font = '11px "Press Start 2P", monospace';
    const tw = tCtx.measureText(char.name).width;
    const bw = tw + 16, bh = 18;
    const bx = p.x - bw / 2, by2 = p.y - bh / 2;
    tCtx.fillStyle   = '#1a1a2eee';
    tCtx.strokeStyle = char.color;
    tCtx.lineWidth   = 2;
    tCtx.beginPath(); tCtx.roundRect(bx, by2, bw, bh, 4); tCtx.fill(); tCtx.stroke();
    tCtx.fillStyle    = char.color;
    tCtx.textAlign    = 'center';
    tCtx.textBaseline = 'middle';
    tCtx.fillText(char.name, p.x, p.y);
    tCtx.restore();
  }

  // Activity / walk bubble — only show when idle
  if (!s.walking) {
    const act = s.activity;
    const bubbleY = by - 44;
    if (act === 'coding')      drawActivityBubble(x + 16, bubbleY, '< / >');
    else if (act === 'debugging') drawActivityBubble(x + 16, bubbleY, 'DEBUG');
    else if (act === 'reading')   drawActivityBubble(x + 16, bubbleY, 'READ');
    else if (act === 'drawing')   drawActivityBubble(x + 16, bubbleY, 'ART');
    else if (act === 'gaming')    drawActivityBubble(x + 16, bubbleY, 'PLAY');
    else if (act === 'thinking')  drawActivityBubble(x + 16, bubbleY, '...');
    else if (act === 'designing') drawActivityBubble(x + 16, bubbleY, 'UI/UX');
    else if (act === 'snacking')  drawActivityBubble(x + 16, bubbleY, 'YUM');
    else if (act === 'watching')  drawActivityBubble(x + 16, bubbleY, 'LOOK');
    else if (act === 'napping') {
      const zz = Math.sin(gameTime * 0.03);
      const p1 = toScreen(x + 18 + zz * 2, bubbleY + 4 - Math.abs(zz) * 5);
      const p2 = toScreen(x + 23 + zz * 3, bubbleY - 3 - Math.abs(zz) * 3);
      tCtx.save();
      tCtx.globalAlpha  = 0.8;
      tCtx.fillStyle    = PAL.white;
      tCtx.textBaseline = 'middle';
      tCtx.font = '16px "Press Start 2P", monospace';
      tCtx.fillText('z', p1.x, p1.y);
      tCtx.font = '11px "Press Start 2P", monospace';
      tCtx.fillText('z', p2.x, p2.y);
      tCtx.restore();
    } else if (act === 'stargazing' || act === 'sketching') {
      drawActivityBubble(x + 16, bubbleY, '✦✦✦');
    }
  }
}

function drawStellaeVariant(x, y, outfit, activity, walking, walkFrame, facing) {
  // Mirror horizontally when walking left
  if (walking && facing === 'left') {
    ctx.save();
    ctx.translate(x + 9, 0);
    ctx.scale(-1, 1);
    ctx.translate(-(x + 9), 0);
  }
  drawStellaeBase(x, y);
  if (outfit === 'blazer')        drawOutfitBlazer(x, y, walking, walkFrame);
  else if (outfit === 'uniform')  drawOutfitUniform(x, y, activity, walking, walkFrame);
  else                            drawOutfitCozy(x, y, activity, walking, walkFrame);
  if (walking && facing === 'left') ctx.restore();
}

// --- MASTER NPC DRAWING ---
function drawMasterNPC() {
  if (currentRoom !== 'office') return;

  const img = SPRITES['master_scene'];
  if (!img || !img.complete) return;

  const npcX = masterNPC.x * TILE;
  const npcY = masterNPC.y * TILE;
  const sw = 60; // Scaled up ~20% maintaining the 0.94 aspect ratio
  const sh = 64; 

  // Gentle breathing/working bob
  const bob = Math.sin(gameTime * 0.06) * 0.8;
  // Subtle arm movement (simulated by slight horizontal wobble)
  const armBob = Math.sin(gameTime * 0.12) * 0.4;

  // The master NPC needs to sit at the same Y level as others
  const drawX = npcX - sw / 2 + armBob + 14; // Shifted right slightly to align body with shadow
  const drawY = npcY - sh + 28 + bob;

  // Shadow
  ctx.globalAlpha = 0.25;
  rect(npcX - 12, npcY + 22, 42, 4, '#000');
  ctx.globalAlpha = 1;

  // Hover glow
  if (hoveredEntity === 'master_npc') {
    ctx.globalAlpha = 0.12 + Math.sin(gameTime * 0.06) * 0.04;
    rect(drawX - 2, drawY - 2, sw + 4, sh + 4, masterNPC.color);
    ctx.globalAlpha = 1;
  }

  // Draw the character image
  ctx.drawImage(img, drawX, drawY, sw, sh);

  // Soldering spark effect (approximate tip of the soldering iron)
  const sparkPhase = (gameTime % 90);
  if (sparkPhase < 12) {
    const sparkX = npcX - 2 + armBob;
    const sparkY = npcY + 1 + bob;
    ctx.globalAlpha = 0.7 + Math.random() * 0.3;
    const sparkColors = ['#ff8830', '#ffcc00', '#ffffff'];
    px(sparkX + Math.random()*4-2, sparkY + Math.random()*3-1, 2, 2, sparkColors[Math.floor(Math.random()*3)]);
    px(sparkX + Math.random()*6-3, sparkY + Math.random()*4-2, 1, 1, sparkColors[Math.floor(Math.random()*3)]);
    ctx.globalAlpha = 1;
  }

  // Name tag on hover
  if (hoveredEntity === 'master_npc') {
    const p = toScreen(npcX, drawY - 8);
    tCtx.save();
    tCtx.font = '11px "Press Start 2P", monospace';
    const tw = tCtx.measureText(masterNPC.name).width;
    const bw = tw + 16, bh = 18;
    const bx = p.x - bw / 2, by2 = p.y - bh / 2;
    tCtx.fillStyle = '#1a1a2eee';
    tCtx.strokeStyle = masterNPC.color;
    tCtx.lineWidth = 2;
    tCtx.beginPath(); tCtx.roundRect(bx, by2, bw, bh, 4); tCtx.fill(); tCtx.stroke();
    tCtx.fillStyle = masterNPC.color;
    tCtx.textAlign = 'center';
    tCtx.textBaseline = 'middle';
    tCtx.fillText(masterNPC.name, p.x, p.y);
    tCtx.restore();
  }

  // Working bubble
  const workBob = Math.sin(gameTime * 0.05) * 1;
  drawTextBubble(npcX + 14, drawY - 6 + workBob, '⚡ SOLDER', 9, '#ff8830', '#1a1a2eee', '#ff883088');
}

// --- DIALOG SYSTEM ---
const dialogBox = document.getElementById('dialog-box');
const dialogSpeaker = dialogBox.querySelector('.speaker');
const dialogText = dialogBox.querySelector('.text');

let dialogAutoTimer = null;
const DIALOG_AUTO_MS = 4000;

function resetAutoBar() {
  const bar = document.getElementById('dialogAutoBar');
  if (!bar) return;
  bar.style.animation = 'none';
  void bar.offsetWidth;
  bar.style.animation = `autoShrink ${DIALOG_AUTO_MS}ms linear forwards`;
}

function scheduleAutoAdvance() {
  clearTimeout(dialogAutoTimer);
  resetAutoBar();
  dialogAutoTimer = setTimeout(() => {
    if (dialogActive) advanceDialog();
  }, DIALOG_AUTO_MS);
}

function showDialog(charKey) {
  const char = characters[charKey];
  const dialogs = char.dialogs[currentRoom];
  if (!dialogs || dialogs.length === 0) return;

  dialogActive = true;
  currentDialog = { char, dialogs, charKey };
  dialogIndex = 0;

  dialogSpeaker.textContent = `${char.name} - ${char.title}`;
  dialogSpeaker.style.color = char.color;
  dialogText.textContent = dialogs[0];
  dialogBox.style.display = 'block';
  dialogBox.style.borderColor = char.color;
  scheduleAutoAdvance();
}

function advanceDialog() {
  clearTimeout(dialogAutoTimer);
  if (!currentDialog) return;
  dialogIndex++;
  if (dialogIndex >= currentDialog.dialogs.length) {
    closeDialog();
    return;
  }
  dialogText.textContent = currentDialog.dialogs[dialogIndex];
  scheduleAutoAdvance();
}

function closeDialog() {
  clearTimeout(dialogAutoTimer);
  dialogActive = false;
  currentDialog = null;
  dialogBox.style.display = 'none';
}

// --- INTERACTION ---

canvas.addEventListener('click', (e) => {
  if (dialogActive) {
    advanceDialog();
    return;
  }

  const rect2 = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect2.left) / SCALE;
  const my = (e.clientY - rect2.top) / SCALE;

  // Check character clicks (use runtime position)
  for (const [key, char] of Object.entries(characters)) {
    if (!char.state) continue;
    const cx = Math.round(char.state.rx * TILE);
    const cy = Math.round(char.state.ry * TILE);
    // Adjusted hitbox for new taller sprites
    if (mx >= cx - 10 && mx <= cx + 26 && my >= cy - 48 && my <= cy + 26) {
      showDialog(key);
      spawnClickParticles(e.clientX, e.clientY, char.color);
      return;
    }
  }

  // Check master NPC click (office only)
  if (currentRoom === 'office') {
    const mnx = masterNPC.x * TILE;
    const mny = masterNPC.y * TILE;
    if (mx >= mnx - 20 && mx <= mnx + 30 && my >= mny - 30 && my <= mny + 30) {
      const text = masterNPC.dialogs[masterNPC.dialogIndex % masterNPC.dialogs.length];
      masterNPC.dialogIndex++;
      dialogActive = true;
      currentDialog = { char: masterNPC, dialogs: [text], charKey: 'master_npc' };
      dialogIndex = 0;
      dialogSpeaker.textContent = `${masterNPC.name} - ${masterNPC.title}`;
      dialogSpeaker.style.color = masterNPC.color;
      dialogText.textContent = text;
      dialogBox.style.display = 'block';
      dialogBox.style.borderColor = masterNPC.color;
      scheduleAutoAdvance();
      spawnClickParticles(e.clientX, e.clientY, masterNPC.color);
      return;
    }
  }
});

dialogBox.addEventListener('click', () => {
  if (dialogActive) advanceDialog();
});

canvas.addEventListener('mousemove', (e) => {
  const rect2 = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect2.left) / SCALE;
  const my = (e.clientY - rect2.top) / SCALE;

  hoveredEntity = null;
  canvas.style.cursor = 'default';

  for (const [key, char] of Object.entries(characters)) {
    if (!char.state) continue;
    const cx = Math.round(char.state.rx * TILE);
    const cy = Math.round(char.state.ry * TILE);
    // Adjusted hitbox for new taller sprites
    if (mx >= cx - 10 && mx <= cx + 26 && my >= cy - 48 && my <= cy + 26) {
      hoveredEntity = key;
      canvas.style.cursor = 'pointer';
      break;
    }
  }

  // Check master NPC hover (office only)
  if (!hoveredEntity && currentRoom === 'office') {
    const mnx = masterNPC.x * TILE;
    const mny = masterNPC.y * TILE;
    if (mx >= mnx - 20 && mx <= mnx + 30 && my >= mny - 30 && my <= mny + 30) {
      hoveredEntity = 'master_npc';
      canvas.style.cursor = 'pointer';
    }
  }
});

// --- PARTICLES ---

function spawnClickParticles(x, y, color) {
  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 / 12) * i;
    particles.push({
      x, y,
      vx: Math.cos(angle) * (2 + Math.random() * 3),
      vy: Math.sin(angle) * (2 + Math.random() * 3),
      life: 20 + Math.random() * 10,
      maxLife: 30,
      color,
      size: 2 + Math.random() * 2,
    });
  }
}

function updateParticles() {
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life--;
    const alpha = p.life / p.maxLife;
    pCtx.globalAlpha = alpha;
    pCtx.fillStyle = p.color;
    pCtx.fillRect(p.x, p.y, p.size, p.size);
  });
  pCtx.globalAlpha = 1;
}

// --- AMBIENT PARTICLES (room-specific) ---

function spawnAmbientParticles() {
  if (currentRoom === 'rooftop' && Math.random() < 0.05) {
    // Shooting star
    particles.push({
      x: Math.random() * pCanvas.width,
      y: Math.random() * pCanvas.height * 0.3,
      vx: 3 + Math.random() * 2,
      vy: 1 + Math.random(),
      life: 15,
      maxLife: 15,
      color: PAL.white,
      size: 2,
    });
  }
  if (currentRoom === 'office' && Math.random() < 0.02) {
    // Floating code particle
    particles.push({
      x: Math.random() * pCanvas.width,
      y: pCanvas.height,
      vx: (Math.random() - 0.5) * 0.5,
      vy: -0.5 - Math.random(),
      life: 60,
      maxLife: 60,
      color: PAL.screen,
      size: 1.5,
    });
  }
}

function updateTimeDisplay() {
  const day = STORY_DATA[storyState.dayIndex];
  const ev = day?.events[storyState.eventIndex];
  const timeStr = ev ? ev.time : '--:--';
  const season = getSeason();
  document.getElementById('time-display').textContent = `${timeStr} | DAY ${day?.day || '?'} | ${season}`;
}

function getSeason() {
  const month = new Date().getMonth();
  if (month >= 2 && month <= 4) return 'SPRING';
  if (month >= 5 && month <= 7) return 'SUMMER';
  if (month >= 8 && month <= 10) return 'AUTUMN';
  return 'WINTER';
}

          type:'copy', author:'stellae_cozy', title:'墙报摘句',
          content:'"等星黎的日子也算一种连载。"\n\n——我们把它贴在办公室门口。\n提醒每一个进门的同事：\n用户的时间线，和我们的版本线，是同一条河。',
        },
      },
      {
        time: '20:00', type: 'rooftop', room: 'rooftop', label: '🌙 下一程',
        positions: { stellae_ceo:[8,10], stellae_cozy:[10,10], stellae_designer:[12,10], stellae_dev:[14,10] },
        dialog: [
          { speaker:'stellae_ceo', text:'1.0 不是终点，是我们终于敢把星黎交给世界的那一秒。' },
          { speaker:'stellae_cozy', text:'2.0 呢？' },
          { speaker:'stellae_ceo', text:'2.0 是——她学会在热闹里仍只对你认真。' },
          { speaker:'stellae_dev', text:'（举手）我申请继续当那个扫尾巴的人。' },
          { speaker:'stellae_designer', text:'我申请继续当那个把尾巴画好看的人。' },
          { speaker:'stellae_cozy', text:'那我负责把尾巴毛茸茸～' },
        ],
      },
    ],
  },
];

// ============================================================
// STORY ENGINE — 自动播放剧本 + UI 面板控制
// ============================================================
const storyState = {
  dayIndex: 0,
  eventIndex: 0,
  lineIndex: 0,
  playing: false,
  speed: 1,
  lineTimer: 0,
  transitionTimer: 0,
  phase: 'idle', // idle | transition | dialog | artifact | eventGap
};

const LINE_INTERVAL = 300; // frames between lines (~5 seconds at 60fps)
const EVENT_GAP = 18000; // ~5 minutes gap between events at 1x
const TRANSITION_TIME = 180;

function getCharColor(key) {
  return characters[key]?.color || '#888';
}

function getCharName(key) {
  return characters[key]?.name || key;
}

function addChatEntry(speaker, text, time) {
  const log = document.getElementById('chat-log');
  const div = document.createElement('div');
  div.className = 'chat-entry';
  const color = getCharColor(speaker);
  div.innerHTML = `<div class="chat-speaker" style="color:${color}">${getCharName(speaker)}</div><div class="chat-text" style="border-color:${color}">${text}</div>`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function addChatEventLabel(label) {
  const log = document.getElementById('chat-log');
  const div = document.createElement('div');
  div.className = 'chat-event-wrap';
  div.innerHTML = `<span class="chat-event-label">${label}</span>`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function addArtifactCard(artifact) {
  const panel = document.getElementById('artifacts-panel');
  // Remove placeholder
  if (panel.querySelector('div[style]')) panel.innerHTML = '';
  const typeLabels = { doc:'文档', code:'代码', design:'设计', copy:'文案' };
  const card = document.createElement('div');
  card.className = 'artifact-card';
  card.innerHTML = `<div class="artifact-header"><span class="artifact-type ${artifact.type}">${typeLabels[artifact.type] || artifact.type}</span><span class="artifact-title">${artifact.title}</span></div><div class="artifact-author">by ${getCharName(artifact.author)} · Day ${STORY_DATA[storyState.dayIndex].day}</div><div class="artifact-content">${artifact.content}</div>`;
  panel.prepend(card);
}

function updateDayDots() {
  const container = document.getElementById('day-dots');
  container.innerHTML = '';
  STORY_DATA.forEach((day, i) => {
    const dot = document.createElement('div');
    dot.className = 'day-dot';
    dot.setAttribute('data-label', `D${day.day}`);
    if (i < storyState.dayIndex) dot.classList.add('done');
    if (i === storyState.dayIndex) dot.classList.add('current');
    dot.style.cursor = 'pointer';
    dot.addEventListener('click', () => jumpToDay(i));
    container.appendChild(dot);
  });
}

function jumpToDay(dayIndex) {
  storyState.dayIndex = dayIndex;
  storyState.eventIndex = 0;
  storyState.lineIndex = 0;
  storyState.phase = 'idle';
  storyState.playing = true;
  document.getElementById('play-btn').textContent = '⏸ PAUSE';
  document.getElementById('play-btn').classList.add('active');
  updateDayDots();
  updateDayInfo();
  updateProgress();
  startEvent();
}

function updateDayInfo() {
  const day = STORY_DATA[storyState.dayIndex];
  if (!day) return;
  const ev = day.events[storyState.eventIndex];
  const timeStr = ev ? ev.time : '--:--';
  document.getElementById('day-info').innerHTML = `DAY ${day.day} · <span>${day.stage} ${day.stageTitle}</span><br>${timeStr} · ${day.title}`;
}

function updateProgress() {
  const day = STORY_DATA[storyState.dayIndex];
  if (!day) return;
  const pct = ((storyState.eventIndex + 1) / day.events.length * 100).toFixed(0);
  document.getElementById('progress-fill').style.width = pct + '%';
}

function moveCharsToPositions(positions) {
  for (const [key, pos] of Object.entries(positions)) {
    const char = characters[key];
    if (!char || !char.state) continue;
    char.state.tx = pos[0];
    char.state.ty = pos[1];
    char.state.walking = true;
    char.state.walkTick = 0;
  }
}

function startEvent() {
  const day = STORY_DATA[storyState.dayIndex];
  if (!day) { storyState.playing = false; return; }
  const ev = day.events[storyState.eventIndex];
  if (!ev) {
    // Day complete, next day
    storyState.dayIndex++;
    storyState.eventIndex = 0;
    storyState.lineIndex = 0;
    if (storyState.dayIndex >= STORY_DATA.length) {
      storyState.playing = false;
      addChatEventLabel('🎉 S1 起源篇 · 完');
      return;
    }
    updateDayDots();
    addChatEntry('system', '');
    const hr = document.createElement('hr');
    hr.className = 'chat-divider';
    document.getElementById('chat-log').appendChild(hr);
    storyState.phase = 'transition';
    storyState.transitionTimer = TRANSITION_TIME;
    return;
  }

  // Switch room if needed
  if (ev.room !== currentRoom) {
    currentRoom = ev.room;
    document.querySelectorAll('.room-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.room === currentRoom);
    });
    resetCharacterStates();
  }

  addChatEventLabel(ev.label || ev.time);
  if (ev.positions) moveCharsToPositions(ev.positions);

  storyState.lineIndex = 0;
  storyState.phase = 'dialog';
  storyState.lineTimer = Math.round(40 / storyState.speed); // short initial delay

  updateDayInfo();
  updateProgress();
}

function updateStory() {
  if (!storyState.playing) return;

  if (storyState.phase === 'transition') {
    storyState.transitionTimer--;
    if (storyState.transitionTimer <= 0) {
      startEvent();
    }
    return;
  }

  if (storyState.phase === 'dialog') {
    storyState.lineTimer--;
    if (storyState.lineTimer <= 0) {
      const day = STORY_DATA[storyState.dayIndex];
      const ev = day?.events[storyState.eventIndex];
      if (!ev) return;

      if (storyState.lineIndex < ev.dialog.length) {
        const line = ev.dialog[storyState.lineIndex];
        addChatEntry(line.speaker, line.text);
        storyState.lineIndex++;
        storyState.lineTimer = Math.round(LINE_INTERVAL / storyState.speed);
      } else {
        // Dialog done for this event
        if (ev.artifact) {
          addArtifactCard(ev.artifact);
          storyState.phase = 'artifact';
          storyState.lineTimer = Math.round(EVENT_GAP / storyState.speed);
        } else {
          storyState.phase = 'eventGap';
          storyState.lineTimer = Math.round(EVENT_GAP / storyState.speed);
        }
      }
    }
    return;
  }

  if (storyState.phase === 'artifact' || storyState.phase === 'eventGap') {
    storyState.lineTimer--;
    if (storyState.lineTimer <= 0) {
      storyState.eventIndex++;
      startEvent();
    }
    return;
  }
}

// Panel tab switching
document.querySelectorAll('.panel-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const panel = tab.dataset.panel;
    document.getElementById('chat-log').style.display = panel === 'chat' ? 'block' : 'none';
    document.getElementById('artifacts-panel').style.display = panel === 'artifacts' ? 'block' : 'none';
  });
});

// Play/Pause
document.getElementById('play-btn').addEventListener('click', () => {
  storyState.playing = !storyState.playing;
  const btn = document.getElementById('play-btn');
  btn.textContent = storyState.playing ? '⏸ PAUSE' : '▶ PLAY';
  btn.classList.toggle('active', storyState.playing);
  if (storyState.playing && storyState.phase === 'idle') {
    startEvent();
  }
});

// Speed control
document.getElementById('speed-btn').addEventListener('click', () => {
  const speeds = [1, 2, 5, 10];
  const idx = speeds.indexOf(storyState.speed);
  storyState.speed = speeds[(idx + 1) % speeds.length];
  document.getElementById('speed-btn').textContent = storyState.speed + 'x';
});

updateDayDots();
updateDayInfo();

function gameLoop() {
  gameTime++;
  ctx.clearRect(0, 0, W, H);
  tCtx.clearRect(0, 0, tCanvas.width, tCanvas.height);

  // Draw room
  if (currentRoom === 'office') drawOffice();
  else if (currentRoom === 'lounge') drawLounge();
  else if (currentRoom === 'rooftop') drawRooftop();

  // Story engine tick
  updateStory();

  // Move characters, then draw (sort by Y so front chars overlap back ones)
  updateCharacters();
  const sorted = Object.entries(characters).sort(([,a],[,b]) =>
    (a.state ? a.state.ry : 0) - (b.state ? b.state.ry : 0));
  for (const [key, char] of sorted) {
    drawCharacter(char, key);
  }

  // Draw master NPC (always in office, after other characters)
  drawMasterNPC();

  // Update UI
  if (gameTime % 60 === 0) {
    updateTimeDisplay();
    updateStatusBar();
  }

  // Particles
  spawnAmbientParticles();
  updateParticles();

  requestAnimationFrame(gameLoop);
}

// --- CENTER CANVAS ---
function centerCanvas() {
  resizeTextCanvas();
}

window.addEventListener('resize', centerCanvas);
centerCanvas();
updateTimeDisplay();
updateStatusBar();
initCharacterStates();
// Auto-start story
storyState.playing = true;
storyState.phase = 'idle';
startEvent();
document.getElementById('play-btn').textContent = '⏸ PAUSE';
document.getElementById('play-btn').classList.add('active');

// --- SIDE PANEL RESPONSIVE TOGGLE ---
const sidePanel = document.getElementById('side-panel');
const panelToggle = document.getElementById('panel-toggle');
let panelCollapsed = false;

function toggleSidePanel() {
  panelCollapsed = !panelCollapsed;
  if (window.innerWidth <= 600) {
    sidePanel.classList.toggle('expanded', !panelCollapsed);
  } else {
    sidePanel.classList.toggle('collapsed', panelCollapsed);
  }
  panelToggle.classList.toggle('visible', panelCollapsed);
  setTimeout(centerCanvas, 50);
}

function checkPanelResponsive() {
  const w = window.innerWidth;
  if (w <= 600) {
    if (!panelCollapsed) {
      sidePanel.classList.remove('expanded');
      panelCollapsed = true;
    }
    panelToggle.classList.add('visible');
  } else if (w <= 800) {
    if (!sidePanel.classList.contains('collapsed')) {
      sidePanel.classList.add('collapsed');
      panelCollapsed = true;
      panelToggle.classList.add('visible');
    }
  } else {
    if (!panelCollapsed) {
      sidePanel.classList.remove('collapsed');
      sidePanel.classList.remove('expanded');
      panelToggle.classList.remove('visible');
    }
  }
}

window.addEventListener('resize', checkPanelResponsive);
checkPanelResponsive();

gameLoop();

</script>
