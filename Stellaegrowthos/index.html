.bar-list{display:grid;gap:11px}.bar-row{display:grid;grid-template-columns:132px 1fr 46px;gap:10px;align-items:center}.bar-track{height:12px;border-radius:999px;background:#eef2f7;overflow:hidden}.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--violet),var(--cyan))}.bar-fill.green{background:var(--green)}.bar-fill.red{background:var(--red)}.donut{width:220px;height:220px;border-radius:50%;background:conic-gradient(#84cc16 0 var(--pos),#cbd5e1 var(--pos) calc(var(--pos) + var(--neu)),#ef4444 calc(var(--pos) + var(--neu)) 100%);position:relative;margin:auto}.donut:after{content:"";position:absolute;inset:52px;background:#fff;border-radius:50%}.donut-label{position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:2}.donut-label b{font-size:30px;color:var(--violet)}

.ai-fab{position:fixed;right:24px;bottom:24px;width:62px;height:62px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;box-shadow:0 18px 42px rgba(109,57,242,.35);z-index:50;display:grid;place-items:center}.ai-avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 30% 28%,#fff 0 5px,transparent 6px),linear-gradient(135deg,#6d39f2,#ec4899);color:#fff;font-weight:760;box-shadow:inset 0 0 0 1px rgba(255,255,255,.38)}.ai-avatar-fab{width:42px;height:42px;font-size:16px}.ai-avatar-img{width:34px;height:34px;border-radius:50%;object-fit:cover;display:block;border:1px solid rgba(255,255,255,.55);box-shadow:0 0 0 2px rgba(109,57,242,.18)}.ai-fab .ai-avatar-img{width:46px;height:46px;border-width:2px}.ai-panel{position:fixed;right:24px;bottom:96px;width:420px;max-width:calc(100vw - 48px);height:620px;max-height:calc(100vh - 130px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:49;display:none;overflow:hidden}.ai-panel.open{display:flex;flex-direction:column}.ai-head{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px}.ai-body{flex:1;overflow:auto;padding:14px;display:grid;gap:10px;align-content:start}.bubble{padding:10px 12px;border-radius:10px;max-width:92%}.bubble.bot{background:#f8f7ff;border:1px solid #ddd6fe}.bubble.user{background:var(--violet);color:#fff;margin-left:auto}.ai-quick{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}.ai-input{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}.ai-input input{flex:1;border:1px solid var(--line2);border-radius:8px;padding:0 10px;height:36px}

<body>
<section class="auth-gate" id="authGate">
  <div class="auth-card">
    <div class="brand-k">STELLAE GROWTHOS</div>
    <h1>星黎监测 OS</h1>
    <p>管理员登录后进入用户反馈、舆情雷达、研发闭环和 AI 问询工作台。</p>
    <div class="form">
      <input id="gateUser" placeholder="管理员账号" value="admin">
      <input id="gatePass" type="password" placeholder="管理员密码" onkeydown="if(event.key==='Enter')login(true)">
      <button class="btn primary" onclick="login(true)"><i data-lucide="lock"></i>登录系统</button>
    </div>
    <div class="auth-error" id="authError"></div>
  </div>
</section>

<div class="app locked" id="mainApp">
  <aside class="side">
    <div class="brand">
      <div class="brand-k">STELLAE GROWTHOS</div>
      <h1>星黎监测 OS</h1>
      <p>用户反馈 · 舆情雷达 · 研发闭环 · AI 问询</p>
      <div class="status"><div><span class="pulse"></span><span id="syncState">加载数据链路</span></div><div id="updateAt">等待同步</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">数据源：QQ群 / 共创群 / 管理通知群 / 未来全网接口</div>
  </aside>
  <main class="main">
    <header class="top">
      <div class="crumb"><h2 id="pageTitle">总览驾驶舱</h2><p id="pageDesc">测试反馈、需求趋势、研发状态与同步健康度</p></div>
      <div class="tools">
        <button class="btn" onclick="syncNow()"><i data-lucide="refresh-cw"></i>数据更新</button>
        <button class="btn" onclick="sendReport()"><i data-lucide="send"></i>发送报告</button>
        <button class="btn primary" onclick="openAI()"><i data-lucide="sparkles"></i>AI Ask</button>
        <button class="btn ghost" onclick="openLogin()"><i data-lucide="lock"></i><span id="loginText">登录</span></button>
      </div>
    </header>
    <section class="workspace">
      <div class="view active" id="view-overview"></div>
      <div class="view" id="view-signals"></div>
      <div class="view" id="view-radar"></div>
      <div class="view" id="view-dev"></div>
      <div class="view" id="view-demand"></div>
      <div class="view" id="view-ai"></div>
      <div class="view" id="view-archive"></div>
      <div class="view" id="view-settings"></div>
    </section>
  </main>
</div>

<button class="ai-fab" title="星黎 AI" onclick="toggleAIPanel()"><img class="ai-avatar-img" src="cocreate/stellae-head.png" alt="星黎" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ai-avatar ai-avatar-fab',textContent:'星'}))"></button>
<aside class="ai-panel" id="aiPanel">
  <div class="ai-head"><img class="ai-avatar-img" src="cocreate/stellae-head.png" alt="星黎" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ai-avatar',textContent:'星'}))"><div><b>星黎 AI 助手</b><div class="sub" id="aiStatus">上下文问询 · DeepSeek 可接入</div></div><button class="btn ghost" style="margin-left:auto" onclick="toggleAIPanel(false)"><i data-lucide="x"></i></button></div>
  <div class="ai-body" id="aiBody"></div>
  <div class="ai-quick" id="aiQuick"></div>
  <div class="ai-input"><input id="aiInput" placeholder="向星黎询问当前页面、用户反馈、研发问题…" onkeydown="if(event.key==='Enter')askAI()"><button class="btn primary" onclick="askAI()">发送</button></div>
</aside>

<div class="modal" id="loginModal">
  <div class="modal-card">
    <h3>管理员登录</h3>
    <p class="sub">登录后可手动同步、保存研发状态、生成报告。</p>
    <div class="form">
      <input id="adminUser" placeholder="管理员账号" value="admin">
      <input id="adminPass" type="password" placeholder="管理员密码">
      <button class="btn primary" onclick="login()">登录</button>
    </div>
  </div>
</div>

<script>
let DATA={}, RADAR={}, STATE={}, SETTINGS={}, CURRENT='overview', SELECTED={signals:null,dev:null,demand:null}, FILTERS={signals:'all',dev:'all'}, ADMIN_TOKEN=localStorage.getItem('stellae_admin_token')||'';
const LOCAL_SETTINGS_KEY='stellae_growthos_ai_settings_v1';
const STATUS={new_signal:'新信号',triage:'待评审',confirmed:'已确认',in_dev:'开发中',verify:'待验证',resolved:'已解决',ignored:'不处理'};
const LEGACY={pending:'triage',progress:'in_dev',done:'resolved',wontfix:'ignored'};
const NAV=[
  ['overview','layout-dashboard','总览','Command','测试反馈、需求趋势、研发状态与同步健康度'],
  ['signals','radio','信号流','Live','当日新增 / Bug / 需求 / 舆情统一信号流'],
  ['radar','radar','话题雷达','VOC','声量、关键词、情绪和未来全网舆情接口'],
  ['dev','wrench','开发问题','Dev','研发问题列表、详情、状态和跟进记录'],
  ['demand','list-checks','需求池','Need','用户需求标签化评估与排行'],
  ['archive','archive','归档','Round','第一轮归档与历史查询'],
  ['settings','settings','设置','Admin','管理员、数据源、模型和同步任务']
];
function $(s){return document.querySelector(s)}
function esc(v){const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML}
function js(v){return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n')}
function api(path){if(location.protocol==='file:')return 'http://127.0.0.1:8091'+path;if(location.pathname.startsWith('/Stellaegrowthos/'))return '/Stellaegrowthos'+path;return path}
function localSettings(){try{return JSON.parse(localStorage.getItem(LOCAL_SETTINGS_KEY)||'{}')}catch(e){return {}}}
function saveLocalSettings(v){localStorage.setItem(LOCAL_SETTINGS_KEY,JSON.stringify(v||{}))}
function mergedSettings(remote={}){const local=localSettings();const ai={baseUrl:'https://api.deepseek.com/chat/completions',model:'deepseek-chat',...(remote.ai||{}),...(local.ai||{})};ai.hasKey=!!(local.ai&&local.ai.apiKey)||!!ai.hasKey;return {...remote,ai,dataSources:[...(remote.dataSources||[]),...(local.dataSources||[])]}}
function num(v){return Number(v||0).toLocaleString('zh-CN')}
function icon(n){return `<i data-lucide="${n}"></i>`}
function chip(t,c=''){return `<span class="chip ${c}">${esc(t)}</span>`}
function pchip(p){return chip((p||'p2').toUpperCase(),p==='p0'?'p0':p==='p1'?'p1':'')}
function stateFor(id){const s=STATE.bugs&&STATE.bugs[id];const raw=typeof s==='string'?s:(s&&s.status);return LEGACY[raw]||raw||'triage'}
function noteFor(id){const s=STATE.bugs&&STATE.bugs[id];return typeof s==='object'?(s.notes||''):''}
function pageMeta(){return NAV.find(x=>x[0]===CURRENT)||NAV[0]}
function applyIcons(){if(window.lucide)lucide.createIcons()}
function confidence(v,q){return chip(`置信 ${v||'-'}%${q?' · '+q:''}`,Number(v)>=75?'violet':'p1')}
function setView(id){CURRENT=id;document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$('#view-'+id)?.classList.add('active');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===id));const m=pageMeta();$('#pageTitle').textContent=m[2];$('#pageDesc').textContent=m[4];renderCurrent();applyIcons()}
function buildNav(){const main=NAV.map(n=>`<button class="nav-btn ${n[0]===CURRENT?'active':''}" data-view="${n[0]}" onclick="setView('${n[0]}')">${icon(n[1])}<b>${n[2]}</b><span class="badge">${n[3]}</span></button>`).join('');const sources=(RADAR.sourceHealth||RADAR.sources||[]).map(s=>`<div class="source-item" onclick="showSource('${esc(s.id)}')"><div class="source-top"><span class="live-dot ${s.liveState==='live'?'':'synced'}"></span><b>${esc(s.name)}</b></div><div class="source-meta"><span>${esc(s.id)}</span><span>${num(s.messages)}</span></div></div>`).join('');$('#nav').innerHTML=`<div class="nav-label">Views</div>${main}<div class="nav-label">Groups</div><div class="source-list">${sources}</div><div class="nav-label">Rounds</div><button class="nav-btn" onclick="setView('archive')">${icon('archive')}<b>第一轮归档</b><span class="badge">5/28</span></button>`}
function renderMetric(label,value,note,color='',view=''){return `<div class="card metric ${view?'entry':''}" ${view?`onclick="setView('${view}')" title="进入${esc(label)}"`:''}><div class="metric-label"><span>${esc(label)}</span><span>${view?'OPEN':'METRIC'}</span></div><div class="metric-value" style="${color?'color:'+color:''}">${esc(value)}</div><div class="metric-note">${esc(note)}</div></div>`}
function row(item,type){const active=SELECTED[type]===item.id?'active':'';const lane=item.lane||({bug:'产品 Bug',demand:'需求信号',opportunity:'机会信号',public_opinion:'舆情信号',discussion_fragment:'讨论碎片'}[item.signalType]||item.type||'信号');return `<div class="row ${active}" onclick="selectItem('${type}','${js(item.id)}')"><div class="row-top"><div><div class="row-title">${esc(item.title)}</div><div class="row-meta">${esc(item.source||item.category||'')} · ${esc(item.impact||item.summary||item.aiSummary||'').slice(0,58)}</div></div><div class="score">${esc(item.score||item.confidence||'')}</div></div><div class="chips">${item.isToday?chip(item.todayLabel||'当日新增','green'):chip(item.todayLabel||lane)}${chip(lane,'violet')}${item.priority?pchip(item.priority):''}${item.status?chip(STATUS[item.status]||item.status):''}${item.confidence?confidence(item.confidence,item.evidenceQuality):''}${(item.tags||[]).slice(0,2).map(t=>chip(t,'violet')).join('')}</div></div>`}
function quoteLines(items){return (items||[]).slice(0,6).map(q=>`<div class="quote"><b>${esc(q.u||'群友')} ${esc(q.date||'')} ${esc(q.t||q.time||'')}</b><br>${esc(q.c||q.text||q.t||'')}</div>`).join('')||'<div class="sub">暂无原声证据</div>'}
function contextBlocks(blocks){return (blocks||[]).slice(0,3).map(b=>`<div><h4>上下文 · ${esc((b.anchor&&b.anchor.u)||'')}</h4>${(b.messages||[]).map(m=>`<div class="context-line ${m.hit?'hit':''}"><b>${esc(m.group)} · ${esc(m.u)} ${esc(m.time)}</b><br>${esc(m.t||'')}</div>`).join('')}</div>`).join('')||'<div class="sub">暂无上下文</div>'}
function shotGrid(items){return (items||[]).length?`<div class="detail-block"><h4>问题截图</h4><div class="shots">${items.slice(0,3).map(s=>`<a class="shot" href="${esc(s.url)}" target="_blank" rel="noreferrer"><img src="${esc(s.url)}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'sub',textContent:'截图缓存失效'}))"><span>${esc(s.caption||'问题截图')}</span></a>`).join('')}</div></div>`:''}
function reviewsFor(id){const s=STATE.bugs&&STATE.bugs[id];return typeof s==='object'?(s.reviews||[]):[]}
function issueDetail(item,type='signals'){if(!item)return '<div class="detail-scroll"><div class="sub">请选择左侧条目查看详情。</div></div>';const st=stateFor(item.id),notes=noteFor(item.id),reviews=reviewsFor(item.id);const quotes=item.quotes&&item.quotes.length?item.quotes:(item.samples&&item.samples.length?item.samples:[{u:'群友',c:item.evidence||item.summary}]);return `<div class="detail-scroll"><div class="detail-title"><div><h2>${esc(item.title)}</h2><div class="chips">${chip(item.lane||item.signalType||'信号','violet')}${item.isToday?chip(item.todayLabel||'当日新增','green'):''}${pchip(item.priority)}${chip(STATUS[st]||st)}${confidence(item.confidence,item.evidenceQuality)}${chip(item.source||'')}</div></div><div class="score">${esc(item.score||item.confidence||'')}</div></div><p class="sub">${esc(item.summary||item.aiSummary||'')}</p><div class="evidence-grid"><div class="detail-card"><h4>用户原声</h4>${quoteLines(quotes)}</div><div class="detail-card"><h4>上下文链路</h4>${contextBlocks(item.contexts)}</div></div>${shotGrid(item.screenshots)}<div class="detail-block"><h4>影响范围</h4>${(item.impactList&&item.impactList.length?item.impactList:[item.impact]).filter(Boolean).map(x=>`<div class="context-line">${esc(x)}</div>`).join('')||'<div class="sub">暂无影响范围</div>'}</div><div class="detail-block"><h4>研发 / 产品建议</h4>${(item.dev&&item.dev.length?item.dev:[item.suggestedAction]).filter(Boolean).map(x=>`<div class="context-line">${esc(x)}</div>`).join('')||'<div class="sub">暂无建议</div>'}</div><div class="detail-block"><h4>跟进状态与评审记录</h4><div class="status-line"><select class="select" onchange="saveState('${js(item.id)}','status',this.value)">${Object.keys(STATUS).map(k=>`<option value="${k}" ${k===st?'selected':''}>${STATUS[k]}</option>`).join('')}</select><textarea class="note" id="note-${esc(item.id)}" placeholder="负责人 / 修复说明 / 验证结论">${esc(notes)}</textarea></div><div style="margin-top:8px"><button class="btn primary" onclick="saveReview('${js(item.id)}')">${icon('save')}保存评审</button></div><div class="review-list">${reviews.map(r=>`<div class="review-item"><b>${esc(r.status||'评审')}</b> · ${esc(r.time||'')}<br>${esc(r.notes||'')}</div>`).join('')||'<div class="sub">暂无评审记录</div>'}</div></div></div>`}
function demandDetail(item){if(!item)return '<div class="detail-scroll"><div class="sub">请选择左侧需求查看详情。</div></div>';return `<div class="detail-scroll"><div class="detail-title"><div><h2>${esc(item.title)}</h2><div class="chips">${chip(item.rankBand,item.score>=78?'green':'violet')}${chip(item.lane)}${(item.tags||[]).map(t=>chip(t,'violet')).join('')}</div></div><div class="score">${item.score}</div></div><p class="sub">${esc(item.summary||'')}</p><div class="detail-block"><h4>评估口径</h4><div class="grid g3"><div class="card"><b>${num(item.count)}</b><div class="sub">提及数</div></div><div class="card"><b>${num(item.users)}</b><div class="sub">涉及用户</div></div><div class="card"><b>${num(item.confidence)}%</b><div class="sub">置信度</div></div></div></div><div class="detail-block"><h4>代表样本</h4>${(item.samples||[]).map(s=>`<div class="quote"><b>${esc(s.u||'群友')} ${esc(s.time||'')}</b><br>${esc(s.t||s.text||'')}</div>`).join('')||'<div class="sub">暂无样本</div>'}</div><div class="detail-block"><h4>下一步</h4><div class="context-line">${esc(item.nextStep||'进入产品评审')}</div></div></div>`}
function renderOverview(){const m=RADAR.metrics||{}, t=RADAR.topicIntelligence||{}, actions=RADAR.actionItems||[], flow=RADAR.signalFlow||[], dev=RADAR.devIssues||[], demands=RADAR.demandItems||[];$('#view-overview').innerHTML=`<div class="grid g4">${renderMetric('实时信号',num(flow.length),`当日新增 ${num(flow.filter(x=>x.isToday).length)} · Bug/需求/舆情`,'','signals')}${renderMetric('话题雷达',num((t.kpis||{}).relevantVolume||((t.sentiment||{}).relevant||0)),`过滤闲聊 ${num((t.sentiment||{}).filteredOut||0)} 条`,'','radar')}${renderMetric('开发问题',num(dev.length),`P1/P0 ${num(dev.filter(x=>['p0','p1'].includes(x.priority)).length)} 条`,'var(--amber)','dev')}${renderMetric('需求池',num(demands.length),`高优先 ${num(demands.filter(x=>x.rankBand==='高优先').length)} 条`,'','demand')}</div><div class="grid g2" style="margin-top:14px"><div class="panel"><div class="panel-h"><h3>今天需要看的信号</h3><button class="btn ghost" onclick="setView('signals')">进入信号流</button></div><div class="list">${flow.slice(0,5).map(x=>row(x,'signals')).join('')}</div></div><div class="panel"><div class="panel-h"><h3>研发待处理</h3><button class="btn ghost" onclick="setView('dev')">进入开发问题</button></div><div class="list">${dev.slice(0,5).map(x=>row(x,'dev')).join('')}</div></div></div><div class="grid g2" style="margin-top:14px"><div class="panel"><div class="panel-h"><h3>话题与情绪</h3><button class="btn ghost" onclick="setView('radar')">进入雷达</button></div><div class="body">${bars((t.topicRanking||[]).slice(0,6),'topic','count')}</div></div><div class="panel"><div class="panel-h"><h3>待执行动作</h3><span class="sub">${num(actions.length)} 个</span></div><div class="list">${actions.slice(0,5).map(a=>`<div class="row"><div class="row-title">${esc(a.title)}</div><div class="row-meta">${esc(a.kind)} · ${esc(a.aiNextStep||'')}</div><div class="chips">${pchip(a.priority)}${confidence(a.confidence,a.evidenceQuality)}</div></div>`).join('')}</div></div></div>`}
function bars(items,labelKey,valueKey){const max=Math.max(1,...items.map(x=>Number(x[valueKey]||0)));return `<div class="bar-list">${items.map(x=>`<div class="bar-row" title="${esc(x[labelKey]||x.name)}：${num(x[valueKey])}"><div>${esc(x[labelKey]||x.name)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,Number(x[valueKey]||0)/max*100)}%"></div></div><b>${num(x[valueKey])}</b></div>`).join('')}</div>`}
function selectItem(type,id){SELECTED[type]=id;renderCurrent();applyIcons()}
function filterBtn(scope,key,label,count){return `<button class="filter ${FILTERS[scope]===key?'active':''}" onclick="setFilter('${scope}','${key}')">${label}${count!=null?' '+num(count):''}</button>`}
function setFilter(scope,key){FILTERS[scope]=key;if(scope==='signals')SELECTED.signals=null;if(scope==='dev')SELECTED.dev=null;renderCurrent();applyIcons()}
function applySignalFilter(items,key){return items.filter(x=>key==='all'||(key==='bug'&&x.signalType==='bug')||(key==='demand'&&x.signalType==='demand')||(key==='opportunity'&&x.signalType==='opportunity')||(key==='public_opinion'&&x.signalType==='public_opinion')||(key==='fragment'&&x.signalType==='discussion_fragment')||(key==='today'&&x.isToday)||(key==='p0'&&x.priority==='p0')||(key==='p1'&&x.priority==='p1'))}
function renderSignals(){const all=RADAR.signalFlow||RADAR.testingSignals||[],items=applySignalFilter(all,FILTERS.signals);if(!SELECTED.signals&&items[0])SELECTED.signals=items[0].id;const item=items.find(x=>x.id===SELECTED.signals)||items[0];$('#view-signals').innerHTML=`<div class="split"><div class="panel list-pane"><div class="panel-h"><h3>实时信号流</h3><span class="sub">${num(items.length)} / ${num(all.length)} 条</span></div><div class="filters">${filterBtn('signals','all','全部',all.length)}${filterBtn('signals','today','当日新增',all.filter(x=>x.isToday).length)}${filterBtn('signals','bug','Bug',all.filter(x=>x.signalType==='bug').length)}${filterBtn('signals','fragment','讨论碎片',all.filter(x=>x.signalType==='discussion_fragment').length)}${filterBtn('signals','demand','需求信号',all.filter(x=>x.signalType==='demand').length)}${filterBtn('signals','opportunity','机会信号',all.filter(x=>x.signalType==='opportunity').length)}${filterBtn('signals','public_opinion','舆情信号',all.filter(x=>x.signalType==='public_opinion').length)}${filterBtn('signals','p0','P0',all.filter(x=>x.priority==='p0').length)}${filterBtn('signals','p1','P1',all.filter(x=>x.priority==='p1').length)}</div><div class="list">${items.map(x=>row(x,'signals')).join('')||'<div class="sub">当前筛选下暂无信号</div>'}</div></div><div class="panel detail-pane"><div class="panel-h"><h3>信号详情</h3><span class="sub">原声 / 上下文 / 截图 / 跟进</span></div>${issueDetail(item,'signals')}</div></div>`}
function renderActiveUsers(users){return `<div class="user-list">${(users||[]).slice(0,12).map(u=>`<div class="user-item"><div class="user-top"><div><b>${esc(u.nickname||'群友')}</b><div class="user-id">QQ ${esc(u.qq||'')}</div></div><div class="score">${num(u.feedbackMessages||0)}</div></div><div class="chips">${chip('交流 '+num(u.messages||0))}${chip('产品 '+num(u.productMessages||0),'violet')}${chip('负面 '+num(u.negative||0),(u.negative||0)>0?'red':'')}${chip('正向 '+num(u.positive||0),'green')}${chip('需求 '+num(u.demands||0),'violet')}</div><div class="sub" style="margin-top:6px">${(u.groups||[]).map(g=>`${esc(g.name)} ${num(g.messages)}`).join(' · ')}</div><div class="sub" style="margin-top:5px">${(u.topics||[]).slice(0,3).map(x=>`${esc(x.topic)} ${num(x.count)}`).join(' · ')}</div></div>`).join('')||'<div class="sub">暂无活跃反馈用户</div>'}</div>`}
function renderRadar(){const t=RADAR.topicIntelligence||{}, sent=t.sentiment||{}, k=t.kpis||{};const pos=sent.positive||0,neu=sent.neutral||0,neg=sent.negative||0;const rules=((t.semanticModel||{}).rules||[]).map(r=>`<div class="context-line">${esc(r)}</div>`).join('');$('#view-radar').innerHTML=`<div class="grid g4">${renderMetric('产品相关讨论',num(sent.relevant||k.relevantVolume||0),`总抓取 ${num(k.volume||0)} · 已过滤 ${num(sent.filteredOut||0)}`)}${renderMetric('真实反馈/评价',num(sent.feedback||sent.total||0),'情绪分母，不含普通闲聊')}${renderMetric('负面反馈',num(neg)+'%',`负面样本 ${num(k.negativeSamples||0)}`,'var(--red)')}${renderMetric('活跃反馈用户',num((t.activeUsers||[]).length),'按反馈条数排序')}</div><div class="grid g2" style="margin-top:14px"><div class="panel"><div class="panel-h"><h3>声量趋势</h3><span class="sub">测试 / 共创 / 产品相关</span></div><div class="body">${trend(t.trend||[])}</div></div><div class="panel"><div class="panel-h"><h3>真实反馈情绪</h3><span class="sub">${esc(sent.model||'sentiment')}</span></div><div class="body"><div class="donut" title="正面 ${pos}% / 中性 ${neu}% / 负面 ${neg}%" style="--pos:${pos}%;--neu:${neu}%"><div class="donut-label"><div><b>${neg}%</b><br><span class="sub">负面</span></div></div></div><div class="chips" style="justify-content:center">${chip('正面 '+pos+'%','green')}${chip('中性 '+neu+'%')}${chip('负面 '+neg+'%','red')}</div><p class="sub" style="text-align:center;margin-top:8px">${esc(sent.note||'')}</p><div class="chips" style="justify-content:center">${(sent.emotionKeywords||[]).map(e=>chip(e.name+' '+e.count,'violet')).join('')}</div></div></div></div><div class="grid g2" style="margin-top:14px"><div class="panel"><div class="panel-h"><h3>语义词云</h3><span class="sub">信息概念 · 按反馈权重缩放</span></div><div class="body word-cloud">${(t.keywordCloud||[]).map(w=>`<span title="${esc(w.word)}：${num(w.count)} · ${esc(w.tone||'')}" class="word ${esc(w.tone||'')}" style="font-size:${Number(w.size||18)}px">${esc(w.word)}</span>`).join('')}</div></div><div class="panel"><div class="panel-h"><h3>话题排行</h3><span class="sub">Topic Ranking</span></div><div class="body">${bars((t.topicRanking||[]).slice(0,10),'topic','count')}</div></div></div><div class="grid g2" style="margin-top:14px"><div class="panel"><div class="panel-h"><h3>活跃用户反馈榜</h3><span class="sub">QQ / 昵称 / 交流条数</span></div><div class="body">${renderActiveUsers(t.activeUsers||[])}</div></div><div class="panel"><div class="panel-h"><h3>语义算法口径</h3><span class="sub">Context Model</span></div><div class="body">${rules}<div class="detail-block"><h4>来源 / 平台对比</h4>${bars(t.platformBreakdown||[],'name','count')}</div></div></div></div><div class="grid g2" style="margin-top:14px"><div class="panel"><div class="panel-h"><h3>实时负面流</h3><span class="sub">Risk Stream</span></div><div class="body stream">${(t.negativeStream||[]).slice(0,8).map(q=>`<div class="stream-item"><b>${esc(q.group)} · ${esc(q.u)} ${esc(q.time)}</b><br><span class="sub">${esc(q.text)}</span></div>`).join('')||'<div class="sub">当前没有高置信负面样本</div>'}</div></div><div class="panel"><div class="panel-h"><h3>正向/期待流</h3><span class="sub">Positive Stream</span></div><div class="body stream">${(t.positiveStream||[]).slice(0,8).map(q=>`<div class="stream-item"><b>${esc(q.group)} · ${esc(q.u)} ${esc(q.time)}</b><br><span class="sub">${esc(q.text)}</span></div>`).join('')||'<div class="sub">暂无正向样本</div>'}</div></div></div>`}
function trend(items){const max=Math.max(1,...items.map(x=>Math.max(Number(x.testing||0),Number(x.cocreate||0))));return `<div>${items.length?`<div class="trend">${items.map(x=>`<div style="flex:1" title="${esc(x.date)} 测试 ${num(x.testing)} / 共创 ${num(x.cocreate)} / 产品相关 ${num(x.relevant||0)}"><div class="trend-col"><div class="trend-bar" style="height:${Math.max(6,x.testing/max*100)}%"></div><div class="trend-bar co" style="height:${Math.max(6,x.cocreate/max*100)}%"></div></div><div class="trend-date">${esc((x.date||'').slice(5))}</div></div>`).join('')}</div>`:'<div class="sub">暂无趋势</div>'}</div>`}
function applyDevFilter(items,key){return items.filter(x=>key==='all'||(key==='p0'&&x.priority==='p0')||(key==='p1'&&x.priority==='p1')||(key==='in_dev'&&stateFor(x.id)==='in_dev')||(key==='verify'&&stateFor(x.id)==='verify')||(key==='triage'&&stateFor(x.id)==='triage'))}
function renderDev(){const all=RADAR.devIssues||[],items=applyDevFilter(all,FILTERS.dev);if(!SELECTED.dev&&items[0])SELECTED.dev=items[0].id;const item=items.find(x=>x.id===SELECTED.dev)||items[0];$('#view-dev').innerHTML=`<div class="split"><div class="panel list-pane"><div class="panel-h"><h3>研发问题列表</h3><span class="sub">${num(items.length)} / ${num(all.length)} 条</span></div><div class="filters">${filterBtn('dev','all','全部',all.length)}${filterBtn('dev','p0','P0',all.filter(x=>x.priority==='p0').length)}${filterBtn('dev','p1','P1',all.filter(x=>x.priority==='p1').length)}${filterBtn('dev','triage','待评审',all.filter(x=>stateFor(x.id)==='triage').length)}${filterBtn('dev','in_dev','开发中',all.filter(x=>stateFor(x.id)==='in_dev').length)}${filterBtn('dev','verify','待验证',all.filter(x=>stateFor(x.id)==='verify').length)}</div><div class="list">${items.map(x=>row(x,'dev')).join('')||'<div class="sub">当前筛选下暂无研发问题</div>'}</div></div><div class="panel detail-pane"><div class="panel-h"><h3>研发详情与跟进</h3><span class="sub">可保存状态和评审记录</span></div>${issueDetail(item,'dev')}</div></div>`}
function renderDemand(){const items=RADAR.demandItems||[];if(!SELECTED.demand&&items[0])SELECTED.demand=items[0].id;const item=items.find(x=>x.id===SELECTED.demand);$('#view-demand').innerHTML=`<div class="split"><div class="panel list-pane"><div class="panel-h"><h3>需求池排行</h3><span class="sub">${num(items.length)} 条</span></div><div class="filters"><button class="filter active">全部</button><button class="filter">高优先</button><button class="filter">陪伴感</button><button class="filter">多模态</button></div><div class="list">${items.map(x=>row(x,'demand')).join('')}</div></div><div class="panel detail-pane"><div class="panel-h"><h3>需求详情</h3><span class="sub">标签 / 排名 / 样本</span></div>${demandDetail(item)}</div></div>`}
function renderAI(){const sample=(RADAR.devIssues||[])[0];$('#view-ai').innerHTML=`<div class="grid g2"><div class="panel"><div class="panel-h"><h3>AI Ask 独立工作台</h3><span class="sub">全站上下文</span></div><div class="body"><p class="sub">这里是固定入口；右下角浮窗在任意页面可用。生产环境应由后端 /api/ai/chat 代理 DeepSeek，避免前端暴露 Key。</p><div class="chips">${chip('当前页上下文')}${chip('研发问题库')}${chip('用户原声')}${chip('需求池')}${chip('报告生成')}</div><div style="margin-top:14px"><button class="btn primary" onclick="openAI('帮我总结今天最需要研发处理的前三个问题')">总结研发 Top3</button> <button class="btn" onclick="openAI('根据当前最高优先级问题，生成群内回复话术')">生成回复话术</button></div></div></div><div class="panel"><div class="panel-h"><h3>建议接入方式</h3><span class="sub">DeepSeek</span></div><div class="body"><div class="context-line">前端调用 /api/ai/chat</div><div class="context-line">服务端读取 DEEPSEEK_API_KEY 或 settings.json</div><div class="context-line">知识库上下文包含 radar_data、page_state、当前选中条目</div><div class="context-line">支持日报、周报、群回复、研发工单四类模板</div></div></div></div>`}
function renderArchive(){$('#view-archive').innerHTML=`<div class="grid g2"><div class="panel"><div class="panel-h"><h3>第一轮归档说明</h3><span class="sub">2026-05-28 截止</span></div><div class="body"><p>第一轮问题用于历史查询与回归验证，不混入第二轮当前优先级。</p><div class="chips" style="margin-top:12px">${chip('历史问题 '+num((RADAR.rounds?.round1||{}).issueCards||0))}${chip('功能建议 '+num((RADAR.rounds?.round1||{}).featureCards||0))}${chip('已解决 '+num((RADAR.rounds?.round1||{}).resolved||0),'green')}</div><a class="btn primary" style="margin-top:16px" href="https://www.stellae.world/AlphaTesting/" target="_blank">${icon('external-link')} 打开 AlphaTesting 历史页</a></div></div><div class="panel"><div class="panel-h"><h3>历史记录查询</h3><span class="sub">归档</span></div><div class="list">${(DATA.bugs||[]).slice(0,10).map(b=>`<div class="row"><div class="row-title">${esc(b.title)}</div><div class="row-meta">${esc(b.date)} · ${esc(b.sub||'')}</div><div class="chips">${pchip(b.p)}${chip(STATUS[stateFor(b.id)]||stateFor(b.id))}</div></div>`).join('')}</div></div></div>`}
function renderSettings(){SETTINGS=mergedSettings(SETTINGS);const cfg=SETTINGS.ai||{},sources=SETTINGS.dataSources||[];$('#view-settings').innerHTML=`<div class="grid g2"><div class="panel"><div class="panel-h"><h3>AI API 配置</h3><span class="sub">${cfg.hasKey?'已配置，可问询全站数据':'线上可本地保存 Key'}</span></div><div class="body"><div class="form"><input id="aiBase" placeholder="API Base，例如 https://api.deepseek.com/chat/completions" value="${esc(cfg.baseUrl||'https://api.deepseek.com/chat/completions')}"><input id="aiModel" placeholder="模型名称" value="${esc(cfg.model||'deepseek-chat')}"><input id="aiKey" type="password" placeholder="${cfg.hasKey?'已保存 Key，留空不修改':'DeepSeek / 兼容 OpenAI API Key'}"><div class="sub">线上无后端代理时，配置会加密前存储在你的浏览器本地；如后端代理可用，会优先保存到服务器。</div><div><button class="btn primary" onclick="saveSettings()">${icon('save')}保存配置</button> <button class="btn" onclick="testAIConfig()">${icon('activity')}测试 API</button></div></div></div></div><div class="panel"><div class="panel-h"><h3>管理员密码</h3><span class="sub">后端代理可用时生效</span></div><div class="body"><div class="form"><input id="oldPass" type="password" placeholder="当前密码"><input id="newPass" type="password" placeholder="新密码"><button class="btn" onclick="changePassword()">${icon('key-round')}修改密码</button></div></div></div></div><div class="grid g2" style="margin-top:14px"><div class="panel"><div class="panel-h"><h3>新增数据源</h3><span class="sub">QQ群 / 外部平台</span></div><div class="body"><div class="form"><div class="form-row"><input id="sourceName" placeholder="数据源名称"><select id="sourceType"><option value="qq_group">QQ群</option><option value="weibo">微博</option><option value="xiaohongshu">小红书</option><option value="douyin">抖音</option><option value="custom">自定义接口</option></select></div><input id="sourceId" placeholder="群号 / 平台账号 / API 标识"><textarea id="sourceNote" placeholder="采集口径、关键词或接口说明"></textarea><button class="btn primary" onclick="addDataSource()">${icon('plus')}增加数据源</button></div></div></div><div class="panel"><div class="panel-h"><h3>数据源列表</h3><span class="sub">Live / Planned</span></div><div class="list">${[...(RADAR.sourceHealth||[]),...sources].map(s=>`<div class="row"><div class="row-title">${esc(s.name)}</div><div class="row-meta">${esc(s.type||s.kind||'QQ群')} · ${esc(s.id||'')} · ${esc(s.sampleRange||s.note||'')}</div><div class="chips">${chip(s.liveState||s.status||'planned',s.liveState==='live'?'green':'')}${s.messages!=null?chip(num(s.messages)+' 条'):''}</div></div>`).join('')}</div></div></div>`}
function renderCurrent(){({overview:renderOverview,signals:renderSignals,radar:renderRadar,dev:renderDev,demand:renderDemand,ai:renderAI,archive:renderArchive,settings:renderSettings}[CURRENT]||renderOverview)()}
async function persistState(){localStorage.setItem('stellae_radar_state_v2',JSON.stringify(STATE));await fetch(api('/api/save-state'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(STATE)}).catch(()=>{})}
async function saveState(id,field,value){STATE.bugs=STATE.bugs||{};STATE.bugs[id]=STATE.bugs[id]||{};STATE.bugs[id][field]=value;await persistState();renderCurrent()}
async function saveReview(id){STATE.bugs=STATE.bugs||{};STATE.bugs[id]=STATE.bugs[id]||{};const item=STATE.bugs[id];const noteEl=document.getElementById('note-'+id);item.notes=noteEl?noteEl.value:item.notes||'';item.status=item.status||stateFor(id);item.reviews=item.reviews||[];item.reviews.unshift({time:new Date().toLocaleString('zh-CN',{hour12:false}),status:STATUS[item.status]||item.status,notes:item.notes});await persistState();renderCurrent();alert('评审记录已保存')}
function showSource(id){const s=(RADAR.sourceHealth||[]).find(x=>String(x.id)===String(id));if(!s)return;alert(`${s.name}\n群号：${s.id}\n状态：${s.liveState||s.status}\n消息：${s.messages}\n范围：${s.sampleRange||'-'}\n\n如本机 QQ 支持，可复制群号或使用 QQ 打开。`)}
function openLogin(){$('#loginModal').classList.add('open')}$('#loginModal').addEventListener('click',e=>{if(e.target.id==='loginModal')e.currentTarget.classList.remove('open')})
function updateAuthUI(){const ok=!!ADMIN_TOKEN;$('#authGate')?.classList.toggle('hidden',ok);$('#mainApp')?.classList.toggle('locked',!ok);if($('#loginText'))$('#loginText').textContent=ok?'已登录':'登录';applyIcons()}
async function login(fromGate=false){const username=(fromGate?$('#gateUser'):$('#adminUser')).value.trim(),password=(fromGate?$('#gatePass'):$('#adminPass')).value;let r=await fetch(api('/api/login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})}).catch(()=>null);let d=r&&r.ok?await r.json():null;if(!d&&username==='admin'&&password==='stellae-admin-dev')d={ok:true,token:'static-admin'};if(d&&d.ok){ADMIN_TOKEN=d.token||'local';localStorage.setItem('stellae_admin_token',ADMIN_TOKEN);$('#loginModal').classList.remove('open');if($('#authError'))$('#authError').textContent='';updateAuthUI()}else{const msg=(d&&d.error)||'登录失败';if(fromGate&&$('#authError'))$('#authError').textContent=msg;else alert(msg)}}
function localCutoff(){const d=new Date();const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`}
async function syncNow(){if(!ADMIN_TOKEN){openLogin();return}if(ADMIN_TOKEN==='static-admin'){alert('正式静态地址仅展示已发布数据；QQ 抓取和同步请在本机监测 OS 使用。');return}const cutoff=localCutoff();$('#syncState').textContent='正在同步 QQ 群聊';const r=await fetch(api('/api/sync'),{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':ADMIN_TOKEN},body:JSON.stringify({cutoff})}).catch(()=>null);const d=r?await r.json():{ok:false,error:'服务不可用'};if(d.ok){alert(d.message||'同步任务已完成');location.reload()}else{const diag=d.diagnose?`\nOneBot: ${d.diagnose.ok?'open':'closed'}\nWebUI: ${d.diagnose.webuiPortOpen?'open':'closed'}`:'';alert((d.error||'请先登录或检查服务')+diag);$('#syncState').textContent='同步失败，查看诊断'}}
async function sendReport(){const r=await fetch(api('/api/report'),{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':ADMIN_TOKEN},body:JSON.stringify({type:'daily'})}).catch(()=>null);const d=r?await r.json():{ok:false};if(d.ok){const blob=new Blob([d.markdown],{type:'text/markdown;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=d.filename||'stellae-report.md';a.click();URL.revokeObjectURL(a.href)}else alert(d.error||'生成失败')}
function apiDownText(){return '本地 API 服务未启动。请在终端运行：cd /Users/ct/星黎AI产品优化及舆情追踪 && python3 server.py 8091'}
function localPayloadFromForm(){const old=localSettings();const apiKey=$('#aiKey')?.value.trim();return {ai:{...(old.ai||{}),baseUrl:$('#aiBase')?.value.trim()||'https://api.deepseek.com/chat/completions',model:$('#aiModel')?.value.trim()||'deepseek-chat',...(apiKey?{apiKey}:{})}}}
async function saveSettings(){const local=localPayloadFromForm();const payload={ai:{baseUrl:local.ai.baseUrl,model:local.ai.model,apiKey:$('#aiKey')?.value.trim()}};const r=ADMIN_TOKEN&&ADMIN_TOKEN!=='static-admin'?await fetch(api('/api/settings'),{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':ADMIN_TOKEN},body:JSON.stringify(payload)}).catch(()=>null):null;const d=r&&r.ok?await r.json():null;if(d&&d.ok){SETTINGS=mergedSettings(d.settings||SETTINGS);alert('AI API 配置已保存到服务器')}else{saveLocalSettings({...localSettings(),...local});SETTINGS=mergedSettings(SETTINGS);renderCurrent();applyIcons();alert('AI API 配置已保存到当前浏览器，可直接用于线上 AI Ask')}}
async function testAIConfig(){const r=ADMIN_TOKEN&&ADMIN_TOKEN!=='static-admin'?await fetch(api('/api/ai/test'),{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':ADMIN_TOKEN},body:JSON.stringify({question:'请返回星黎监测 OS API 测试成功'})}).catch(()=>null):null;const d=r&&r.ok?await r.json():null;if(d&&d.ok){alert('API 测试成功：'+(d.answer||'ok').slice(0,160));return}const answer=await callBrowserAI('请返回星黎监测 OS API 测试成功', {test:true});alert(answer?'API 测试成功：'+answer.slice(0,160):'API 测试失败：请检查 Base、模型名、Key 或接口 CORS 设置')}
async function changePassword(){const r=await fetch(api('/api/change-password'),{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':ADMIN_TOKEN},body:JSON.stringify({oldPassword:$('#oldPass')?.value,newPassword:$('#newPass')?.value})}).catch(()=>null);const d=r?await r.json():{ok:false};if(d.ok){ADMIN_TOKEN=d.token;localStorage.setItem('stellae_admin_token',ADMIN_TOKEN);alert('密码已修改')}else alert(d.error||'修改失败')}
async function addDataSource(){const item={name:$('#sourceName')?.value.trim(),type:$('#sourceType')?.value,id:$('#sourceId')?.value.trim(),note:$('#sourceNote')?.value.trim(),status:'planned'};if(!item.name||!item.id){alert('请填写名称和标识');return}const r=ADMIN_TOKEN&&ADMIN_TOKEN!=='static-admin'?await fetch(api('/api/settings'),{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':ADMIN_TOKEN},body:JSON.stringify({appendDataSource:item})}).catch(()=>null):null;const d=r&&r.ok?await r.json():null;if(d&&d.ok){SETTINGS=mergedSettings(d.settings||SETTINGS)}else{const local=localSettings();local.dataSources=[...(local.dataSources||[]),item];saveLocalSettings(local);SETTINGS=mergedSettings(SETTINGS)}renderCurrent();applyIcons()}
function toggleAIPanel(force){$('#aiPanel').classList.toggle('open',force===undefined?!$('#aiPanel').classList.contains('open'):force);applyIcons()}
function openAI(q){toggleAIPanel(true);if(q){$('#aiInput').value=q;askAI()}}
function aiBubble(text,role='bot'){$('#aiBody').insertAdjacentHTML('beforeend',`<div class="bubble ${role}">${text}</div>`);$('#aiBody').scrollTop=$('#aiBody').scrollHeight}
function compactItem(x){return {id:x.id,title:x.title,summary:x.summary||x.aiSummary,signalType:x.signalType,lane:x.lane,priority:x.priority,score:x.score,source:x.source,category:x.category,status:x.status,confidence:x.confidence,tags:x.tags,impact:x.impact||x.impactList,dev:x.dev||x.suggestedAction,quotes:(x.quotes||x.samples||[]).slice(0,4),contexts:(x.contexts||[]).slice(0,2)}}
function currentContext(){const meta=pageMeta();return {page:meta[2],selected:SELECTED,meta:RADAR.meta,metrics:RADAR.metrics,sourceHealth:RADAR.sourceHealth,signalFlow:(RADAR.signalFlow||[]).map(compactItem),devIssues:(RADAR.devIssues||[]).map(compactItem),demandItems:(RADAR.demandItems||[]).map(compactItem),discussionFragments:(RADAR.discussionFragments||[]).slice(0,20).map(compactItem),topic:RADAR.topicIntelligence,actions:RADAR.actionItems}}
async function callBrowserAI(question,context){SETTINGS=mergedSettings(SETTINGS);const ai=SETTINGS.ai||{},key=(localSettings().ai||{}).apiKey;if(!key)return '';const body={model:ai.model||'deepseek-chat',messages:[{role:'system',content:'你是星黎 GrowthOS 在线监测 Agent。只能基于用户提供的监测数据回答，优先给出结论、证据、风险等级、研发建议和用户回复话术；没有数据就明确说明缺少证据。'},{role:'user',content:`问题：${question}\n\n监测数据：${JSON.stringify(context).slice(0,55000)}`}],temperature:.2};try{const r=await fetch(ai.baseUrl||'https://api.deepseek.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body)});const d=await r.json();return (((d.choices||[{}])[0].message||{}).content||d.error?.message||'').trim()}catch(e){return ''}}
async function askAI(){const q=$('#aiInput').value.trim();if(!q)return;$('#aiInput').value='';aiBubble(esc(q),'user');const context=currentContext();const r=await fetch(api('/api/ai/chat'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,context})}).catch(()=>null);const d=r&&r.ok?await r.json():{ok:false};const direct=d.ok?'':await callBrowserAI(q,context);aiBubble(d.ok?d.answer:(direct||localAI(q)))}
function localAI(q){const issues=RADAR.devIssues||[],demands=RADAR.demandItems||[];if(/回复|话术/.test(q)){const top=issues[0];return `建议回复：我们已经记录到「${esc(top?.title||'相关问题')}」，目前正在根据用户原声和复现信息评估优先级。请补充机型、系统版本、复现步骤和截图，我们会同步给研发继续跟进。`}if(/需求|功能/.test(q)){return `当前需求池优先看：${demands.slice(0,3).map(x=>esc(x.title)+'（'+x.score+'）').join('、')}。`}return `当前最高优先级问题是：${issues.slice(0,3).map(x=>esc(x.title)+'（'+x.score+'）').join('、')}。可进入「开发问题」查看原声、截图和跟进状态。`}
async function init(){buildNav();updateAuthUI();try{STATE=JSON.parse(localStorage.getItem('stellae_radar_state_v2')||'{}')}catch(e){STATE={}}try{const remote=await (await fetch(api('/api/load-state'),{cache:'no-store'})).json();STATE={...STATE,...remote,bugs:{...(STATE.bugs||{}),...(remote.bugs||{})}}}catch(e){}try{SETTINGS=await (await fetch(api('/api/settings'),{cache:'no-store'})).json()}catch(e){SETTINGS={ai:{model:'deepseek-chat'},dataSources:[]}}SETTINGS=mergedSettings(SETTINGS);const bust='?_='+Date.now();DATA=await (await fetch('data.json'+bust,{cache:'no-store'})).json();RADAR=await (await fetch('radar_data.json'+bust,{cache:'no-store'})).json();$('#syncState').textContent=RADAR.meta?.health==='captured'?'数据已同步':'等待同步';$('#updateAt').textContent='更新 '+(RADAR.meta?.lastUpdate||'');buildNav();renderCurrent();aiBubble('你好，我是星黎。你可以问我当前页面、用户反馈、研发问题、需求池，也可以让我生成群内回复话术。');$('#aiQuick').innerHTML=['总结研发 Top3','生成群内回复话术','需求池最高优先级是什么','今天负面舆情集中在哪'].map(q=>`<button class="filter" onclick="openAI('${q}')">${q}</button>`).join('');updateAuthUI()}
init();
</script>
